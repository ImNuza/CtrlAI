<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEE9D9">
<meta name="description" content="A gentle cognitive wellness game for older adults. Grow your garden by exercising your mind.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garden">
<meta name="format-detection" content="telephone=no">
<title>Garden of Life</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
</head>
<body>

</svg>

<!-- ══ APP ROOT ══ -->
<div id="app">

  <!-- Top bar -->
  <header class="topbar" role="banner">
    <div class="topbar-left">
      <span class="coin-chip" id="coin-display" aria-label="Coins">
        <svg class="icon icon-sm"><use href="#icon-coin"/></svg>
        <span id="coin-count">0</span>
      </span>
      <span class="streak-chip" aria-label="Streak">
        <svg class="icon icon-sm"><use href="#icon-streak"/></svg>
        <span id="streak-count">0</span>
      </span>
    </div>
    <div class="topbar-right">
      <!-- Labelled on purpose. A bare hamburger is exactly the abstract
           convention that guidance for older users warns against assuming. -->
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-haspopup="dialog" aria-expanded="false">
        <svg class="icon"><use href="#icon-menu"/></svg>
        <span class="menu-btn-label">Menu</span>
        <span class="menu-badge" id="menu-badge" hidden></span>
      </button>
    </div>
  </header>

  <!-- Notification stack -->
  <div id="notification-stack" aria-live="polite" aria-atomic="false"></div>

  <!-- ══ SCREENS ══ -->
  <main class="screens" role="main">

    <!-- ── PATCHES SCREEN — the garden itself ── -->
    <section class="screen active" id="screen-garden2" role="tabpanel" aria-labelledby="nav-garden2">
      <div class="screen-header">
        <h1 class="screen-title">Your Patches</h1>
        <p class="screen-subtitle" id="garden-date"></p>
      </div>
      <!-- Today's tasks, in one line. The full list still lives in the menu;
           this is here so a player who never opens the menu still knows there
           is something waiting today. -->
      <button class="today-strip" id="today-strip" hidden>
        <svg class="icon" aria-hidden="true"><use href="#icon-sun"/></svg>
        <span class="today-strip-text" id="today-strip-text"></span>
        <svg class="icon icon-sm today-strip-arrow" aria-hidden="true"><use href="#icon-arrow-right"/></svg>
      </button>
      <!-- First-visit hint. It lives above the pan window, not inside the
           field, so it cannot be dragged out of sight. -->
      <div class="garden-hint-slot" id="garden-hint-slot"></div>
      <!-- Bounded pan window: the field is larger than the phone, so it is
           dragged under this fixed window instead of the page scrolling. The
           header and the water button never move. -->
      <div class="garden2-viewport" id="garden2-viewport">
        <div class="garden2-field" id="garden2-scene"></div>
      </div>
      <div class="garden-actions">
        <!-- Every patch has to be reachable without a drag. This shrinks the
             field to fit the window so the whole garden is tappable. -->
        <button class="btn btn-secondary btn-view" id="btn-fit-view">
          <svg class="icon" aria-hidden="true"><use href="#icon-garden"/></svg>
          <span id="btn-fit-view-label">See whole garden</span>
        </button>
        <button class="btn btn-primary btn-lg" id="btn-water-all">
          <svg class="icon"><use href="#icon-water"/></svg>
          Water all plants
        </button>
      </div>
    </section>

    <!-- ── EXERCISES SCREEN — LEVEL PATH ── -->
    <section class="screen" id="screen-exercises" role="tabpanel" aria-labelledby="nav-exercises">
      <div class="screen-header">
        <h1 class="screen-title">Brain Exercises</h1>
        <p class="screen-subtitle">Each course trains a different part of your mind. Start anywhere you like, no timers and no pressure.</p>
      </div>
      <div id="level-path-container"></div>
    </section>

    <!-- ── SHOP SCREEN ── -->
    <section class="screen" id="screen-shop" role="tabpanel" aria-labelledby="nav-shop">
      <div class="screen-header">
        <h1 class="screen-title">Seed Shop</h1>
        <p class="screen-subtitle">Fixed prices, no randomness. One free seed every day.</p>
      </div>
      <div class="shop-coins-bar">
        <span class="coin-chip large">
          <svg class="icon"><use href="#icon-coin"/></svg>
          <span id="shop-coin-count">0</span> coins
        </span>
        <button class="btn btn-ghost btn-sm" id="btn-free-seed">
          <svg class="icon icon-sm"><use href="#icon-gift"/></svg>
          Free daily seed
        </button>
      </div>
      <div class="shop-grid" id="shop-grid"></div>
    </section>

    <!-- ── PROFILE SCREEN ── -->
    <section class="screen" id="screen-profile" role="tabpanel" aria-labelledby="nav-profile">
      <div class="screen-header">
        <h1 class="screen-title">Your Profile</h1>
      </div>
      <div class="profile-cards" id="profile-cards"></div>

      <!-- Meal cards section -->
      <div class="subsection-head" style="margin-top:2rem">Meal Collection</div>
      <p class="meal-collection-note" id="meal-collection-note"></p>
      <div class="meal-grid" id="meal-grid"></div>
    </section>

    <!-- ── ALMANAC SCREEN ── -->
    <section class="screen" id="screen-almanac" aria-label="Garden Almanac">
      <div class="play-header">
        <button class="icon-btn" id="btn-back-from-almanac" aria-label="Back to profile">
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"/></svg>
        </button>
        <div class="play-title">The Garden Almanac</div>
        <div style="width:44px"></div>
      </div>
      <div class="almanac-body" id="almanac-body"></div>
    </section>

    <!-- ── EXERCISE PLAY SCREEN ── -->
    <section class="screen" id="screen-play" role="dialog" aria-modal="true" aria-label="Exercise">
      <div class="play-header">
        <button class="icon-btn" id="btn-back-from-play" aria-label="Back to exercises">
          <svg class="icon"><use href="#icon-arrow-left"/></svg>
        </button>
        <div class="play-title" id="play-title"></div>
        <div style="width:44px"></div>
      </div>
      <div class="play-area" id="play-area"></div>
      <div class="play-footer" id="play-footer"></div>
    </section>

  </main>

  <!-- ══ BOTTOM NAV ══ -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <button class="nav-item active" id="nav-garden2" data-screen="garden2" role="tab" aria-selected="true" aria-controls="screen-garden2" aria-label="Your patches">
      <svg class="icon" aria-hidden="true"><use href="#icon-leaf"/></svg>
      <span>Patches</span>
    </button>
    <button class="nav-item" id="nav-exercises" data-screen="exercises" role="tab" aria-selected="false" aria-controls="screen-exercises" aria-label="Brain exercises">
      <svg class="icon" aria-hidden="true"><use href="#icon-brain"/></svg>
      <span>Exercises</span>
    </button>
    <button class="nav-item" id="nav-shop" data-screen="shop" role="tab" aria-selected="false" aria-controls="screen-shop" aria-label="Seed shop">
      <svg class="icon" aria-hidden="true"><use href="#icon-shop"/></svg>
      <span>Shop</span>
    </button>
    <button class="nav-item" id="nav-profile" data-screen="profile" role="tab" aria-selected="false" aria-controls="screen-profile" aria-label="Profile">
      <svg class="icon" aria-hidden="true"><use href="#icon-profile"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <!-- ══ SHARE MODAL ══ -->
  <div class="modal-overlay" id="share-modal" role="dialog" aria-modal="true" aria-labelledby="share-title" hidden>
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="modal-title" id="share-title">Share Your Garden</h2>
        <button class="icon-btn" id="btn-close-share" aria-label="Close">
          <svg class="icon"><use href="#icon-close"/></svg>
        </button>
      </div>
      <div class="share-card">
        <div class="share-card-inner">
          <div class="share-garden-preview" id="share-preview"></div>
          <div class="share-stats" id="share-stats"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-lg" id="btn-share-native">
          <svg class="icon"><use href="#icon-share"/></svg>
          Share
        </button>
        <button class="btn btn-secondary" id="btn-copy-share">
          <svg class="icon"><use href="#icon-arrow-right"/></svg>
          Copy text
        </button>
      </div>
    </div>
  </div>

  <!-- ══ PLANT DETAIL MODAL ══ -->
  <div class="modal-overlay" id="plant-detail-modal" role="dialog" aria-modal="true" aria-label="Plant details" hidden></div>

  <!-- ══ SEED MENU MODAL (Patches tab: tap an empty patch to plant) ══ -->
  <div class="modal-overlay" id="seed-menu-modal" role="dialog" aria-modal="true" aria-label="Choose a seed to plant" hidden></div>

  <!-- ══ MENU ══
       Today's tasks, sound and sharing, all behind one button so the top bar
       stays quiet. The daily card host lives here now, not in the garden. -->
  <div class="modal-overlay" id="menu-modal" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden>
    <div class="modal-sheet" role="document">
      <div class="modal-header">
        <h2 class="modal-title" id="menu-title">Menu</h2>
        <button class="icon-btn" id="btn-close-menu" aria-label="Close menu">
          <svg class="icon"><use href="#icon-close"/></svg>
        </button>
      </div>
      <div id="daily-card"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary menu-row" id="mute-btn" aria-pressed="false">
          <svg class="icon" id="mute-icon"><use href="#icon-sound"/></svg>
          <span id="mute-label">Sound is on</span>
        </button>
        <button class="btn btn-secondary menu-row" id="share-btn">
          <svg class="icon"><use href="#icon-share"/></svg>
          Share your garden
        </button>
      </div>
    </div>
  </div>

  <!-- ══ WATER ANIMATION OVERLAY ══ -->
  <div id="water-overlay" aria-hidden="true"></div>

  <!-- ══ CONFETTI / CELEBRATION ══ -->
  <div id="celebration-overlay" aria-hidden="true"></div>

</div><!-- /app -->

<script src="game.js"></script>
</body>
</html>
