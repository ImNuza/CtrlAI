<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ee">
<title>Memory Garden</title>
<link rel="stylesheet" href="/shared/ui/tokens.css">
<link rel="stylesheet" href="/shared/ui/base.css">
<link rel="stylesheet" href="/games/memory-garden/css/garden.css">
<style>
  :root {
    --accent: var(--accent-garden);
    --accent-tint: var(--accent-garden-tint);
  }
</style>
</head>
<body>
<main class="page">

  <section id="view-garden" class="view">
    <header class="stack stack-tight">
      <h1 class="game-title" id="garden-heading" tabindex="-1">Memory Garden</h1>
      <p class="muted">One phone, two people, and a plant for every story.</p>
    </header>

    <div class="card card-accent" id="welcome-card">
      <p id="welcome-line" aria-live="polite">Loading the garden.</p>
    </div>

    <div class="plots" id="plots"></div>

    <button type="button" class="btn btn-block" id="start-grow">Grow a new memory</button>

    <p class="centered"><a class="btn btn-plain btn-block" href="/">Back to hub</a></p>
  </section>

  <section id="view-picker" class="view" hidden>
    <h2 id="picker-heading" tabindex="-1">Which old friend calls up a memory?</h2>
    <p class="muted">Pick one. You can always plant another later.</p>
    <div class="objects" id="objects"></div>
    <button type="button" class="btn btn-quiet btn-block" data-back="garden">Back to the garden</button>
  </section>

  <section id="view-prompt" class="view" hidden>
    <p class="muted" id="prompt-step">Question 1 of 3</p>
    <h2 id="prompt-heading" tabindex="-1">Who is in this memory with you?</h2>
    <div class="row" id="prompt-chips"></div>
    <div class="freetext" id="freetext-field" hidden>
      <label class="freetext-label" for="freetext">For the grandchild: add one line of the story (optional)</label>
      <textarea class="freetext-input" id="freetext" rows="2" maxlength="120"></textarea>
    </div>
    <button type="button" class="btn btn-block" id="prompt-next" aria-disabled="true">Next</button>
    <button type="button" class="btn btn-quiet btn-block" id="prompt-back">Back</button>
  </section>

  <section id="view-ceremony" class="view" hidden>
    <h2 id="ceremony-heading" tabindex="-1">Watch it grow</h2>
    <p class="lead" id="ceremony-line" aria-live="polite"></p>
    <div class="stage" id="ceremony-stage"></div>
    <button type="button" class="btn btn-block" id="ceremony-done">See the garden</button>
  </section>

</main>

<div id="view-replay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="replay-title" hidden>
  <div class="overlay-panel card">
    <h2 id="replay-title" tabindex="-1">Your story</h2>
    <div class="stage stage-small" id="replay-plant"></div>
    <div class="row" id="replay-answers"></div>
    <p id="replay-caption"></p>
    <div class="told" id="replay-told" hidden>
      <p class="muted told-lead">As told by the grandchild</p>
      <p class="told-line" id="replay-freetext"></p>
    </div>
    <p class="muted" id="replay-line" aria-live="polite"></p>
    <div class="overlay-foot">
      <button type="button" class="btn btn-block" id="replay-close">Back to garden</button>
    </div>
  </div>
</div>

<script type="module" src="/games/memory-garden/js/main.js"></script>
</body>
</html>
