.garden-avatar[hidden]{display:none}

/* steps(4) walks the four columns and never lands between them. The sheet is
   4 cells wide, so the loop travels exactly one sheet width. */
@keyframes gardener-walk{
  from{background-position-x:0}
  to{background-position-x:-352px}
}
.garden-avatar.walking{
  animation:gardener-walk 0.6s steps(4) infinite;
}
/* Standing still is the walk held on its first frame rather than a separate
   pose, which is what keeps the facing correct when the gardener stops. */
@media (prefers-reduced-motion:reduce){
  .garden-avatar.walking{animation:none}
}

@media (max-height:640px){
  #screen-garden2{overflow-y:auto;overflow-x:hidden}
  .garden2-viewport{flex:none;height:230px}
}

/* ════════════════════════════════════════════════════════════
   PLANT DETAIL PANEL
   ════════════════════════════════════════════════════════════ */

#plant-detail-modal{
  transition:opacity 250ms var(--ease-gentle);
  opacity:0;
}
#plant-detail-modal.open{opacity:1}
#plant-detail-modal .modal-sheet{
  transform:translateY(30px);
  transition:transform 250ms var(--ease-spring);
}
#plant-detail-modal.open .modal-sheet{transform:translateY(0)}

.plant-detail-sheet{padding-top:1.25rem}

/* Seed menu (Patches tab: tap an empty patch to plant in place) shares the
   plant detail modal's fade + slide-up open/close. */
#seed-menu-modal{
  transition:opacity 250ms var(--ease-gentle);
  opacity:0;
}
#seed-menu-modal.open{opacity:1}
#seed-menu-modal .modal-sheet{
  transform:translateY(30px);
  transition:transform 250ms var(--ease-spring);
}
#seed-menu-modal.open .modal-sheet{transform:translateY(0)}

.plant-latin{
  font-family:var(--font-display);
  font-style:italic;
  font-size:1.05rem;
  color:var(--text-muted);
  margin-top:0.15rem;
}

.plant-detail-figure{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  background:var(--bg-deep);
  border:1.5px solid var(--border-light);
  border-radius:var(--radius-xl);
  padding:1.5rem 1rem 1.25rem;
  margin-bottom:1rem;
  cursor:pointer;
  width:100%;
  font-family:inherit;
  transition:border-color var(--duration-fast) var(--ease-gentle);
}
.plant-detail-figure:hover{border-color:var(--foliage-mid)}
.plant-detail-figure:active{transform:scale(0.98)}
.plant-detail-figure:focus-visible{outline:3px solid var(--foliage-mid);outline-offset:2px}

.plant-detail-svg{
  width:130px;
  transform-origin:bottom center;
  margin-bottom:-8px;
}
.plant-detail-svg.wiggle{animation:plant-wiggle 600ms var(--ease-gentle)}
@keyframes plant-wiggle{
  0%,100%{transform:rotate(0deg)}
  20%{transform:rotate(-4deg)}
  40%{transform:rotate(3.5deg)}
  60%{transform:rotate(-2.5deg)}
  80%{transform:rotate(1.5deg)}
}

.plant-touch-hint{
  margin-top:0.75rem;
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-muted);
  font-style:italic;
}

.plant-detail-stats{
  display:flex;
  align-items:center;
  gap:0.75rem;
  flex-wrap:wrap;
  margin-bottom:1rem;
}

.plant-state-badge{
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
  padding:0.45rem 1rem;
  border-radius:var(--radius-pill);
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  border:1.5px solid transparent;
}
.plant-state-badge.state-seed{background:var(--bg-inset);color:var(--text-secondary);border-color:var(--border-mid)}
.plant-state-badge.state-sprout{background:rgba(177,184,161,0.25);color:var(--foliage-shadow);border-color:var(--foliage-highlight)}
.plant-state-badge.state-grown{background:rgba(115,135,93,0.15);color:var(--foliage-shadow);border-color:var(--foliage-mid)}
.plant-state-badge.state-bloom{background:rgba(224,122,95,0.15);color:#7A2F10;border-color:var(--accent-coral)}
.plant-state-badge.state-wilt{background:rgba(231,143,55,0.15);color:#7A4800;border-color:var(--accent-orange)}

.plant-age{
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-secondary);
}
.plant-age .icon{color:var(--text-muted)}

.plant-use-card{
  background:var(--bg-inset);
  border:1.5px solid var(--border-light);
  border-left:4px solid var(--foliage-mid);
  border-radius:var(--radius-md);
  padding:1rem 1.25rem;
  margin-bottom:1rem;
}
.plant-use-title{
  display:flex;
  align-items:center;
  gap:0.5rem;
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--foliage-shadow);
  margin-bottom:0.5rem;
}
.plant-use-text{
  font-family:var(--font-body);
  font-size:1.05rem;
  line-height:1.6;
  color:var(--text-primary);
}

.plant-meals-row{
  display:flex;
  flex-wrap:wrap;
  gap:0.5rem;
  margin-bottom:1rem;
}
.plant-meal-chip{
  display:inline-flex;
  align-items:center;
  gap:0.35rem;
  padding:0.35rem 0.85rem;
  border-radius:var(--radius-pill);
  background:rgba(115,135,93,0.10);
  border:1.5px solid var(--foliage-highlight);
  color:var(--foliage-shadow);
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
}

/* New shelf install animation — applied once by JS after purchase */
.shelf-unit.installed{animation:shelf-install 500ms var(--ease-spring)}
@keyframes shelf-install{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* ════════════════════════════════════════════════════════════
   DAILY TASKS CARD
   ════════════════════════════════════════════════════════════ */

#daily-card{margin:1rem 0 0.5rem}
.daily-card{
  background:var(--bg-surface);
  border:1.5px solid var(--border-light);
  border-radius:var(--radius-xl);
  padding:1.25rem 1.25rem 1rem;
  box-shadow:var(--shadow-paper);
}
/* Inside the menu the sheet already provides the card, so the card drops its
   own frame and reads as the first section of the panel. */
#menu-modal .daily-card{
  background:transparent;
  border:none;
  box-shadow:none;
  padding:0;
}
.daily-card-title{
  display:flex;
  align-items:center;
  gap:0.5rem;
  font-family:var(--font-display);
  font-size:1.35rem;
  font-weight:500;
  color:var(--text-primary);
  margin-bottom:0.75rem;
}
.daily-card-title .icon{color:var(--accent-orange)}
.daily-tasks{display:flex;flex-direction:column;gap:0.5rem}
.daily-task{
  display:flex;
  align-items:center;
  gap:0.75rem;
  width:100%;
  min-height:var(--tap-min);
  padding:0.5rem 0.75rem;
  background:var(--bg-inset);
  border:1.5px solid var(--border-light);
  border-radius:var(--radius-md);
  cursor:pointer;
  font-family:var(--font-body);
  text-align:left;
  transition:all var(--duration-fast) var(--ease-gentle);
}
.daily-task:hover{border-color:var(--foliage-mid)}
.daily-task:active{transform:scale(0.98)}
.daily-task:focus-visible{outline:3px solid var(--foliage-mid);outline-offset:2px}
.daily-task.done{
  background:rgba(115,135,93,0.10);
  border-color:var(--foliage-highlight);
  cursor:default;
}
.daily-task.done .daily-task-text{text-decoration:line-through;color:var(--text-muted)}
.daily-task-check{
  width:32px;height:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color:var(--foliage-shadow);
}
.daily-task-circle{
  width:22px;height:22px;
  border-radius:50%;
  border:2.5px solid var(--border-mid);
  display:block;
}
.daily-task.done .daily-task-check{background:var(--foliage-mid);color:#F5EFEB}
.daily-task-text{
  flex:1;
  font-size:1.1rem;
  font-weight:500;
  color:var(--text-primary);
  line-height:1.3;
}
.daily-task-meta{display:flex;align-items:center;gap:0.5rem;flex-shrink:0}
.daily-task-progress{
  font-size:1rem;
  font-weight:600;
  color:var(--text-secondary);
}
.daily-task-coins{
  display:inline-flex;
  align-items:center;
  gap:0.2rem;
  padding:0.2rem 0.6rem;
  border-radius:var(--radius-pill);
  background:rgba(224,122,95,0.15);
  border:1.5px solid var(--accent-coral);
  color:#7A2F10;
  font-size:1rem;
  font-weight:600;
}
.daily-all-done{
  font-family:var(--font-body);
  font-size:1.1rem;
  color:var(--foliage-shadow);
  font-style:italic;
  padding:0.5rem 0.25rem;
}
.daily-week{
  display:flex;
  align-items:center;
  gap:0.75rem;
  margin-top:0.75rem;
  padding-top:0.75rem;
  border-top:1px solid var(--border-light);
}
.daily-week-label{
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:600;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--text-muted);
  white-space:nowrap;
}
/* Label and count on one line, the ten dots on their own line beneath. All
   three side by side ran past the right edge at phone width. */
.daily-week{flex-wrap:wrap}
.daily-week-label{order:1}
.daily-week-hint,.daily-week-done{order:2;margin-left:auto}
.daily-week-dots{
  order:3;
  flex-basis:100%;
  margin:0.5rem 0 0;
  justify-content:flex-start;
  flex-wrap:wrap;
}
.daily-week-hint{font-size:1rem;color:var(--text-muted);white-space:nowrap}
.daily-week-done{
  display:inline-flex;
  align-items:center;
  gap:0.3rem;
  font-size:1rem;
  font-weight:500;
  color:var(--accent-plum);
  white-space:nowrap;
}

/* ════════════════════════════════════════════════════════════
   THE GARDEN ALMANAC
   ════════════════════════════════════════════════════════════ */

.almanac-body{
  flex:1;
  overflow-y:auto;
  padding:1.25rem;
  -webkit-overflow-scrolling:touch;
}
/* No display here — `.screen` handles none/flex. An ID selector would outrank
   `.screen{display:none}` and leave the Almanac painted behind every screen. */
#screen-almanac{padding:0}

.almanac-summary{
  display:flex;
  align-items:center;
  gap:1rem;
  padding:1.25rem 1.5rem;
  background:var(--bg-surface);
  border:1.5px solid var(--border-light);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-paper);
  margin-bottom:1.5rem;
}
.almanac-summary .icon{color:var(--foliage-shadow)}
.almanac-summary-num{
  font-family:var(--font-display);
  font-size:2rem;
  font-weight:500;
  color:var(--text-primary);
  line-height:1.1;
}
.almanac-summary-num span{
  font-size:1.1rem;
  color:var(--text-muted);
  font-weight:400;
}
.almanac-summary-sub{
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-secondary);
  margin-top:0.15rem;
}

.almanac-section{margin-bottom:1.75rem}
.almanac-cat-head{
  display:flex;
  align-items:center;
  gap:0.5rem;
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:600;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-bottom:0.75rem;
}
.almanac-cat-head .icon{color:var(--foliage-mid)}

.almanac-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:0.75rem;
}

.almanac-plate{
  position:relative;
  background:var(--bg-surface);
  border:1.5px solid var(--border-light);
  border-radius:var(--radius-lg);
  padding:1.25rem 1rem 1rem;
  box-shadow:var(--shadow-paper);
  opacity:0.55;
  transition:opacity var(--duration-normal) var(--ease-gentle);
}
.almanac-plate.earned{opacity:1;border-color:var(--foliage-mid)}
.almanac-plate.mystery{opacity:0.45;border-style:dashed}

.plate-figure{
  width:72px;height:72px;
  margin:0 auto 0.75rem;
  border-radius:50%;
  background:var(--bg-inset);
  border:1.5px solid var(--border-light);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--foliage-shadow);
}
.almanac-plate.earned .plate-figure{
  background:rgba(115,135,93,0.12);
  border-color:var(--foliage-mid);
}
.plate-figure.mystery-mark{
  font-family:var(--font-display);
  font-size:2.25rem;
  color:var(--border-mid);
  background:var(--bg-inset);
}
.plate-name{
  font-family:var(--font-display);
  font-size:1.2rem;
  font-weight:500;
  text-align:center;
  color:var(--text-primary);
  margin-bottom:0.3rem;
}
.plate-desc{
  font-family:var(--font-body);
  font-size:1rem;
  line-height:1.4;
  text-align:center;
  color:var(--text-secondary);
  margin-bottom:0.6rem;
}
.plate-foot{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.5rem;
  flex-wrap:wrap;
}
.plate-tier{
  padding:0.2rem 0.7rem;
  border-radius:var(--radius-pill);
  background:rgba(115,135,93,0.15);
  border:1.5px solid var(--foliage-mid);
  color:var(--foliage-shadow);
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:600;
  letter-spacing:0.04em;
}
.plate-progress{
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  color:var(--text-muted);
}
.plate-stamp{
  position:absolute;
  top:10px;right:10px;
  width:32px;height:32px;
  border-radius:50%;
  background:var(--foliage-mid);
  color:#F5EFEB;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 5px rgba(43,33,24,0.25);
  transform:rotate(8deg);
}

/* Almanac entry card on profile */
.almanac-entry{
  cursor:pointer;
  border-color:var(--foliage-mid);
  width:100%;
  text-align:left;
  font-family:inherit;
}
.almanac-entry:hover{background:rgba(115,135,93,0.06)}

/* Award notification type */
.notif-award{border-left-color:var(--accent-plum)}
.notif-award .notif-icon{color:var(--accent-plum)}

/* Pinned below the pan window, never scrolls out of reach */
.garden-actions{display:flex;flex-direction:column;gap:0.5rem;flex-shrink:0;padding-top:0.5rem}
/* Secondary to the watering button and shorter than it, but still over the
   60px tap floor. Sits on grass, so it needs its own surface to stay legible. */
.btn-view{
  min-height:60px;
  font-size:1.05rem;
  background:rgba(245,239,235,0.92);
}
.btn-view[hidden]{display:none}

/* ── Buttons ── */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:var(--tap-min);
  padding:0 2rem;
  border-radius:var(--radius-md);
  font-family:var(--font-body);
  font-size:1.2rem;
  font-weight:500;
  border:2px solid transparent;
  cursor:pointer;
  transition:all var(--duration-fast) var(--ease-gentle);
  gap:0.5rem;
  letter-spacing:0.01em;
  text-decoration:none;
}
.btn:active{transform:scale(0.97)}
.btn:focus-visible{outline:3px solid var(--foliage-mid);outline-offset:3px}
.btn:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}

.btn-primary{background:var(--foliage-shadow);color:var(--text-on-dark);border-color:var(--foliage-shadow)}
.btn-primary:hover:not(:disabled){background:var(--foliage-deep)}
.btn-secondary{background:transparent;color:var(--foliage-shadow);border-color:var(--foliage-mid)}
.btn-secondary:hover:not(:disabled){background:rgba(115,135,93,0.10)}
.btn-ghost{background:transparent;color:var(--text-secondary);border-color:var(--border-mid)}
.btn-ghost:hover:not(:disabled){color:var(--text-primary);border-color:var(--border-strong)}
.btn-lg{min-height:80px;font-size:1.35rem;padding:0 2.5rem;border-radius:var(--radius-lg)}
/* Still the small button, but never below the 60px tap floor. It was 52px,
   which was the only control on any screen under the floor. */
.btn-sm{min-height:60px;font-size:1.05rem;padding:0 1.25rem}

/* ── Shop ── */
/* Wraps rather than squeezing: at 390px the coin chip and the free-seed
   button together overflowed their row and broke the button label onto two
   lines. Given the room they sit side by side, otherwise the button takes
   its own full-width line. */
.shop-coins-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:0.75rem;
  margin-bottom:1.25rem;
  padding:0.75rem 1rem;
  background:var(--bg-inset);
  border-radius:var(--radius-md);
  border:1px solid var(--border-light);
}
.shop-grid{display:flex;flex-direction:column;gap:0.75rem}
/* Icon, name and price share the top row; the description and the buy button
   each span the full card. The old three-column row left the name about 106px
   at 390px, which broke every two-word seed name across two lines. */
.shop-item{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  column-gap:0.85rem;
  row-gap:0.55rem;
  padding:1rem 1.25rem;
  background:var(--bg-surface);
  border:1.5px solid var(--border-light);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-paper);
  transition:all var(--duration-normal) var(--ease-gentle);
}
.shop-item:hover{border-color:var(--foliage-mid)}
.shop-item.rare{border-color:var(--accent-plum);background:rgba(123,83,113,0.04)}
.shop-item-icon{
  grid-column:1;
  width:60px;height:60px;
  background:var(--bg-deep);
  border-radius:var(--radius-md);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.shop-item-icon svg{width:60%;height:60%}
.shop-item-name{
  grid-column:2;
  font-family:var(--font-display);
  font-size:1.35rem;
  font-weight:500;
  line-height:1.15;
}
.shop-item-price-slot{grid-column:3;justify-self:end}
.shop-item-desc{
  grid-column:1 / -1;
  font-family:var(--font-body);
  font-size:1.05rem;
  color:var(--text-secondary);
  line-height:1.4;
}
.shop-item-action{grid-column:1 / -1}
.shop-item-action .shop-buy-btn{width:100%}
.shop-item-price{
  display:flex;
  align-items:center;
  gap:0.3rem;
  font-family:var(--font-body);
  font-size:1.1rem;
  font-weight:500;
  color:#7A2F10;
  flex-shrink:0;
}
.shop-item-price .icon{color:var(--accent-coral)}
.shop-buy-btn{
  min-width:80px;
  min-height:var(--tap-min);
  padding:0 1.25rem;
  border-radius:var(--radius-md);
  font-family:var(--font-body);
  font-size:1.05rem;
  font-weight:500;
  border:2px solid var(--foliage-mid);
  background:transparent;
  color:var(--foliage-shadow);
  cursor:pointer;
  transition:all var(--duration-fast) var(--ease-gentle);
  flex-shrink:0;
}
.shop-buy-btn:hover{background:rgba(115,135,93,0.10)}
.shop-buy-btn:active{transform:scale(0.95)}
.shop-buy-btn:disabled{opacity:0.4;cursor:not-allowed}
.shop-buy-btn.owned{border-color:var(--success);color:var(--success);background:rgba(68,87,61,0.08)}
.shop-buy-btn.locked{border-color:var(--border-mid);color:var(--text-muted);background:transparent}

/* ── Profile ── */
.profile-cards{display:flex;flex-direction:column;gap:0.75rem}
.profile-card{
  background:var(--bg-surface);
  border:1.5px solid var(--border-light);
  border-radius:var(--radius-lg);
  padding:1.25rem 1.5rem;
  box-shadow:var(--shadow-paper);
  display:flex;
  align-items:center;
  gap:1rem;
}
.profile-card-icon{
  width:56px;height:56px;
  border-radius:var(--radius-md);
  background:var(--bg-deep);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--foliage-shadow);
  flex-shrink:0;
}
.profile-card-title{
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-bottom:0.2rem;
}
.profile-card-value{
  font-family:var(--font-display);
  font-size:1.75rem;
  font-weight:500;
  color:var(--text-primary);
  line-height:1.1;
}
.profile-card-sub{
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-secondary);
  margin-top:0.15rem;
}

/* ── Meal cards ── */
.meal-collection-note{
  font-family:var(--font-body);
  font-size:1.05rem;
  line-height:1.45;
  color:var(--text-secondary);
  margin-bottom:0.9rem;
}
.meal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem}
.meal-card{
  background:var(--bg-surface);
  border:1.5px solid var(--border-light);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-paper);
  transition:all var(--duration-normal) var(--ease-gentle);
}
.meal-card.locked{opacity:0.45;filter:grayscale(60%)}
.meal-card-thumb{
  height:72px;
  background:var(--bg-deep);
  display:flex;
  align-items:center;
  justify-content:center;
}
.meal-card-thumb svg{width:44px;height:44px;color:var(--foliage-mid)}
.meal-card-body{padding:0.75rem 1rem 1rem}
.meal-card-name{
  font-family:var(--font-display);
  font-size:1.1rem;
  font-weight:500;
  margin-bottom:0.2rem;
}
.meal-card-ingredients{
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-secondary);
  line-height:1.35;
}
.meal-card-badge{
  display:inline-flex;
  align-items:center;
  gap:0.25rem;
  padding:0.2rem 0.5rem;
  border-radius:var(--radius-pill);
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  margin-top:0.4rem;
}
.meal-card-badge.unlocked{background:rgba(68,87,61,0.12);color:var(--success)}
.meal-card-badge.locked{background:var(--bg-inset);color:var(--text-muted)}

/* ── Exercise play screen ── */
#screen-play{
  background:var(--bg-primary);
  z-index:30;
  padding:0;
}
.play-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1rem 1.25rem;
  border-bottom:1px solid var(--border-light);
  background:var(--bg-surface);
  flex-shrink:0;
}
.play-title{
  font-family:var(--font-display);
  font-size:1.6rem;
  font-weight:500;
  color:var(--text-primary);
}
.play-area{
  flex:1;
  padding:1.5rem 1.25rem;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:1.25rem;
}
.play-footer{
  padding:1.25rem;
  border-top:1px solid var(--border-light);
  background:var(--bg-surface);
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:0.75rem;
}

/* ── Tile match game ── */
.tile-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0.75rem;
  width:100%;
}
/* One rule for the tile. There used to be two: this one, written when a tile
   was a flat button, and a second further down that added the two-sided flip.
   The old one set overflow:hidden, and overflow other than visible forces
   transform-style:preserve-3d to flatten. Flattened, backface-visibility
   cannot hide the back, so the back stayed painted over the front and every
   revealed tile showed the same face-down leaf instead of its symbol. The
   game was unplayable and looked like a content bug.

   The background, border and svg sizing are gone from here too: .tile-back
   and .tile-front each carry their own now, and having both meant the tile
   painted a third surface behind the two faces. */
.tile{
  aspect-ratio:1;
  border:none;
  background:none;
  padding:0;
  cursor:pointer;
  font-size:0;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 300ms var(--ease-gentle);
}
/* Only while face-down. A flipped tile is already holding a rotateY, and a
   scale here would replace it and flick the tile back over mid-press. */
.tile:not(.flipped):active{transform:scale(0.93)}
.tile.flipped{transform:rotateY(180deg)}
/* The fade goes on the faces, never on .tile. Opacity below 1 is a grouping
   property: it flattens transform-style:preserve-3d exactly as overflow does.
   Fading the tile itself re-broke the flip for matched pairs only, so a
   matched pair kept showing the face-down leaf while an unmatched flip was
   fine. Same bug as the overflow one, wearing a different hat. */
.tile.matched{cursor:default}
.tile.matched .tile-face{opacity:0.75}

/* ── Pattern sequence game ── */
.pattern-display{
  display:flex;
  justify-content:center;
  gap:0.75rem;
  flex-wrap:wrap;
  min-height:80px;
  align-items:center;
  padding:1rem;
  background:var(--bg-surface);
  border-radius:var(--radius-lg);
  border:1.5px solid var(--border-light);
}
.pattern-dot{
  width:56px;height:56px;
  border-radius:50%;
  border:2px solid transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-body);
  font-size:1.5rem;
  font-weight:600;
  color:var(--text-on-dark);
  transition:all var(--duration-fast) var(--ease-gentle);
}
.pattern-dot.active{transform:scale(1.1)}
/* A fixed row of four rather than a wrapping flex line. Wrapping put three
   buttons on one row and orphaned the fourth on its own, which reads as a
   different kind of choice. Equal columns keep the four reading as one set. */
.pattern-options{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0.5rem;
  justify-items:stretch;
}
.pattern-options .pattern-opt-btn{min-width:0;width:100%}
.pattern-opt-label{
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  line-height:1.1;
  color:var(--text-secondary);
}
/* Icon over its name. Taller than the tap floor because it now carries two
   rows, and the name is what makes the choice readable without having to
   interpret a small line drawing. */
.pattern-opt-btn{
  min-width:80px;
  min-height:84px;
  padding:0.5rem 0.6rem;
  border-radius:var(--radius-lg);
  font-family:var(--font-body);
  font-size:1.5rem;
  font-weight:600;
  border:2.5px solid var(--border-mid);
  background:var(--bg-surface);
  cursor:pointer;
  transition:all var(--duration-fast) var(--ease-gentle);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0.15rem;
  color:var(--text-primary);
}
.pattern-opt-btn:active{transform:scale(0.93)}
.pattern-opt-btn:hover{border-color:var(--foliage-mid)}
.pattern-opt-btn.selected{background:rgba(115,135,93,0.15);border-color:var(--foliage-mid)}
.pattern-opt-btn.correct{background:rgba(68,87,61,0.15);border-color:var(--success);color:var(--success)}
.pattern-opt-btn.wrong{background:rgba(174,56,43,0.08);border-color:var(--accent-red);color:var(--accent-red)}

/* ── Odd one out game ── */
.odd-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:0.875rem;
}
.odd-item{
  aspect-ratio:1;
  background:var(--bg-surface);
  border:2.5px solid var(--border-mid);
  border-radius:var(--radius-lg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all var(--duration-fast) var(--ease-gentle);
  gap:0.4rem;
  padding:0.5rem;
}
.odd-item:active{transform:scale(0.94)}
.odd-item:hover{border-color:var(--foliage-mid)}
.odd-item.correct{background:rgba(68,87,61,0.12);border-color:var(--success)}
.odd-item.wrong{background:rgba(174,56,43,0.08);border-color:var(--accent-red)}
.odd-item svg{width:48px;height:48px;color:var(--foliage-shadow)}
.odd-item-label{
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  color:var(--text-secondary);
  text-align:center;
  line-height:1.2;
}

/* ── Word pairs game ── */
/* Three columns, not two. This is a matching game, so every card has to be
   findable from every other, and two columns put the hardest level across
   four and a half screens of scrolling. A third column takes a third of that
   away. The cards stay above the tap floor because the row is shorter, not
   because the cards are. */
.word-pairs{
  display:grid;
  /* minmax(0,1fr), not 1fr. A bare 1fr floors each column at its widest word,
     so the columns came out different widths and the grid read as ragged. */
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0.5rem;
}
.word-card{
  padding:0.9rem 0.5rem;
  background:var(--bg-surface);
  border:2.5px solid var(--border-mid);
  border-radius:var(--radius-lg);
  font-family:var(--font-display);
  font-size:1.25rem;
  font-weight:500;
  color:var(--text-primary);
  text-align:center;
  cursor:pointer;
  transition:all var(--duration-fast) var(--ease-gentle);
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.word-card:active{transform:scale(0.94)}
.word-card:hover{border-color:var(--foliage-mid)}
.word-card.selected{background:rgba(115,135,93,0.15);border-color:var(--foliage-mid)}
.word-card.matched{background:rgba(68,87,61,0.10);border-color:var(--success);opacity:0.65;cursor:default}

/* ════════════════════════════════════════════════════════════
   MAHJONG KAKIS: the kopitiam table
   ════════════════════════════════════════════════════════════

   Ported from archive/mahjong-kakis/style.css. That sheet ran on the CtrlAI
   tokens; everything below is remapped onto the Muted Botanical palette, and the
   three portraits picked up botanical accents in place of the pink, purple and
   slate they used to wear. Only the skin tone is a new value: the palette has no
   token for it, and a green one would not do.

   The table lives inside the existing exercise play screen. .play-area holds the
   name panel and the table, .play-footer holds the player bar. Nothing here is on
   a timer. Every duration comes from a token, so reduced motion zeroes it.
   ──────────────────────────────────────────────────────────── */

:root{
  --kopi-accent:#7A4800;      /* 6.66:1 on bg-surface, 5.91:1 on bg-deep */
  --kopi-tint:#EAE2D0;
  --kopi-shade:rgba(122,72,0,0.30);
  --kaki-dots:#7B5371;        /* was Scam Dojo blue, now plum, 5.53:1 on a tile */
  --kaki-bamboo:#44573D;      /* was Memory Garden green, now foliage shadow, 6.85:1 */
  --kaki-wind:#AE382B;        /* was danger red, now brick red, 5.39:1 */
  --kaki-skin:#E0BC94;
  --kaki-hair-dark:#2B2118;
  --kaki-hair-grey:#B1B8A1;
  --kaki-lily-shirt:#E07A5F;
  --kaki-lily-flower:#C82A36;
  --kaki-flower-heart:#E78F37;
  --kaki-beng-cap:#31482E;
  --kaki-beng-cup:#EAE2D0;
  --kaki-rose-shirt:#7B5371;
  --kaki-kopi:#7A6B5C;
  --kaki-tile-gap:0.5rem;
  --kaki-bubble-height:11.5rem;
  --kaki-portrait-size:4.5rem;
  /* A tile stops growing here. Without the ceiling a sixteen-tile wall on a
     430px phone eats enough height that the player bar falls off the bottom, so
     the grid centres its leftover space instead. */
  --kaki-tile-max:78px;
}

/* Both panels are flex, which would otherwise beat the user agent [hidden] rule. */
.kaki-table[hidden],
.kaki-name-panel[hidden],
.kaki-bar[hidden]{display:none}

.kaki-sr{
  position:absolute;
  width:1px;height:1px;
  margin:-1px;padding:0;border:0;
  overflow:hidden;
  clip:rect(0 0 0 0);
  clip-path:inset(50%);
  white-space:nowrap;
}

/* ── Name panel ── */
.kaki-name-panel{
  display:flex;
  flex-direction:column;
  gap:1.25rem;
}
.kaki-question{
  font-family:var(--font-display);
  font-size:1.75rem;
  font-weight:500;
  line-height:1.2;
  color:var(--text-primary);
}
.kaki-chips{
  display:flex;
  flex-wrap:wrap;
  gap:0.75rem;
}
.kaki-chip{
  flex:1 1 auto;
  min-height:var(--tap-min);
  padding:0 1.25rem;
  border:2px solid var(--border-mid);
  border-radius:var(--radius-pill);
  background:var(--bg-surface);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:1.2rem;
  font-weight:500;
  cursor:pointer;
  transition:all var(--duration-fast) var(--ease-gentle);
}
.kaki-chip:hover{border-color:var(--kopi-accent);background:var(--kopi-tint)}
.kaki-chip:active{transform:scale(0.97)}
.kaki-chip:focus-visible{outline:3px solid var(--kopi-accent);outline-offset:3px}
.kaki-label{
  font-size:1.05rem;
  color:var(--text-secondary);
}
.kaki-input{
  width:100%;
  min-height:var(--tap-min);
  padding:0 1.25rem;
  border:2px solid var(--border-mid);
  border-radius:var(--radius-md);
  background:var(--bg-inset);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:1.25rem;
}
.kaki-input:focus{outline:3px solid var(--kopi-accent);outline-offset:2px;border-color:var(--border-strong)}
.kaki-name-panel .btn-lg{width:100%}
.kaki-name-panel .kaki-label,
.kaki-name-panel .kaki-input{margin-top:0.25rem}

/* ── The table ── */
.kaki-table{
  display:flex;
  flex-direction:column;
  gap:0.875rem;
}

/* ── Kaki row ── */
.kaki-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0.5rem;
}
.kaki{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0.25rem;
  text-align:center;
}
.kaki-portrait{
  display:block;
  width:var(--kaki-portrait-size);
  height:var(--kaki-portrait-size);
  border-radius:50%;
  background:var(--bg-surface);
  box-shadow:var(--shadow-sm);
}
.kaki-portrait svg{width:100%;height:100%;border-radius:50%}
.kaki-who{
  font-size:1.1rem;
  font-weight:500;
  line-height:1.2;
  color:var(--text-primary);
}

/* The ring is declared with its transition here and nowhere else, so it eases in
   on the kaki who starts talking and vanishes the instant the class leaves the
   one who stopped. Two portraits can never wear it at once. */
.kaki.is-speaking .kaki-portrait{
  transform:translateY(-4px);
  box-shadow:0 0 0 4px var(--kopi-accent),var(--shadow-md);
  transition:transform var(--duration-fast) var(--ease-gentle),
             box-shadow var(--duration-fast) var(--ease-gentle);
}
.kaki.is-speaking .kaki-who{font-weight:600;color:var(--kopi-accent)}

/* ── The bubble ── */

/* The slot only ever grows. game.js measures it after every line that lands and
   writes the tallest it has seen this deal into --kaki-slot-floor, so a shorter
   line afterwards cannot pull the table back up under the player's finger. The
   floor is cleared when a new wall is dealt, which is the one moment the player
   is expecting the table to change. */
.kaki-bubble-slot{
  position:relative;
  z-index:2;
  display:flex;
  min-height:max(var(--kaki-bubble-height),var(--kaki-slot-floor,0px));
  padding-top:0.75rem;
}
.kaki-bubble{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  gap:0.25rem;
  width:100%;
  min-height:calc(var(--kaki-bubble-height) - 0.75rem);
  padding:0.875rem 1.125rem;
  border:3px solid var(--kopi-accent);
  border-radius:var(--radius-md);
  background:var(--kopi-tint);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:1.2rem;
  line-height:1.5;
  text-align:left;
  opacity:0;
  pointer-events:none;
  cursor:pointer;
  transition:opacity var(--duration-normal) var(--ease-gentle);
}
.kaki-bubble[data-event]{
  opacity:1;
  pointer-events:auto;
  animation:kaki-bubble-in var(--duration-normal) var(--ease-gentle) 1;
}
.kaki-bubble:focus-visible{outline:3px solid var(--kopi-accent);outline-offset:3px}
.kaki-bubble-name{
  font-size:1.15rem;
  font-weight:600;
  line-height:1.2;
  color:var(--kopi-accent);
}
/* Four lines covers every line in the bank at the longest name the input takes.
   Clamping the text and not the bubble keeps the pointer, which lives outside the
   box, from being clipped away. */
.kaki-bubble-text{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:4;
  line-clamp:4;
  overflow:hidden;
  overflow-wrap:break-word;
}
/* Two stacked triangles make the pointer: the outer one is the border colour,
   the inner one the bubble face. Both sit under the speaking portrait. */
.kaki-bubble::before,
.kaki-bubble::after{
  content:"";
  position:absolute;
  left:var(--kaki-arrow-x,50%);
  width:0;height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  transform:translateX(-50%);
}
.kaki-bubble::before{top:-16px;border-bottom:16px solid var(--kopi-accent)}
.kaki-bubble::after{
  top:-11px;
  border-left-width:12px;
  border-right-width:12px;
  border-bottom:13px solid var(--kopi-tint);
}
@keyframes kaki-bubble-in{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── Tiles ── */

/* Light marble, made of two soft veins and a corner sheen over the surface.
   Four columns that grow with the phone up to a ceiling and no further. */
.kaki-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(var(--tap-min),var(--kaki-tile-max)));
  justify-content:center;
  gap:var(--kaki-tile-gap);
  padding:0.5rem;
  border:5px solid var(--kopi-accent);
  border-radius:var(--radius-lg);
  background-color:var(--bg-surface);
  background-image:
    linear-gradient(118deg,rgba(122,72,0,0.07) 0 6%,rgba(122,72,0,0) 6% 48%),
    linear-gradient(296deg,rgba(122,72,0,0.05) 0 4%,rgba(122,72,0,0) 4% 60%),
    radial-gradient(circle at 26% 18%,rgba(255,255,255,0.9),rgba(255,255,255,0) 62%);
  box-shadow:var(--shadow-md);
}
.kaki-grid:focus{outline:none}

.kaki-tile{
  position:relative;
  display:block;
  width:100%;
  min-width:var(--tap-min);
  min-height:var(--tap-min);
  aspect-ratio:1 / 1.08;
  padding:0.25rem;
  border:3px solid var(--border-mid);
  border-radius:var(--radius-sm);
  background:var(--bg-surface);
  box-shadow:
    inset 0 -10px 0 var(--kopi-tint),
    0 4px 0 var(--kopi-shade),
    var(--shadow-sm);
  cursor:pointer;
  animation:kaki-deal var(--duration-normal) var(--ease-gentle) backwards;
  animation-delay:calc(var(--kaki-i,0) * var(--duration-fast) / 6);
  transition:transform var(--duration-fast) var(--ease-gentle),
             border-color var(--duration-fast) var(--ease-gentle),
             background-color var(--duration-fast) var(--ease-gentle);
}
.kaki-tile svg{width:100%;height:100%}
.kaki-tile text{font-family:var(--font-body)}
.kaki-tile:focus-visible{outline:3px solid var(--kopi-accent);outline-offset:2px}

.kaki-tile[data-state="selected"]{
  border-color:var(--kopi-accent);
  background:var(--kopi-tint);
  transform:translateY(-4px);
  box-shadow:
    inset 0 -10px 0 rgba(122,72,0,0.18),
    0 8px 0 var(--kopi-shade),
    var(--shadow-md);
}
/* Space is kept so the grid never reflows when a pair goes home. */
.kaki-tile[data-state="cleared"]{
  visibility:hidden;
  pointer-events:none;
  animation:none;
}
.kaki-tile.is-clearing{animation:kaki-clear var(--duration-normal) var(--ease-gentle) forwards}
.kaki-tile.is-wiggle{animation:kaki-wiggle var(--duration-normal) var(--ease-gentle) 1}

/* When a kaki has offered help twice with nothing found in between, one pair
   breathes for a moment. Nothing on screen calls it a hint and the tile stays an
   ordinary tap. Reduced motion gets the same news as a steady accent edge. */
.kaki-tile.is-glow{
  border-color:var(--kopi-accent);
  animation:kaki-glow calc(var(--duration-slow) * 2) var(--ease-gentle) 1;
}
@keyframes kaki-glow{
  0%{box-shadow:inset 0 -10px 0 var(--kopi-tint),0 4px 0 var(--kopi-shade),var(--shadow-sm)}
  50%{box-shadow:inset 0 -10px 0 var(--kopi-tint),0 0 0 6px var(--kopi-tint),0 4px 0 var(--kopi-shade),var(--shadow-md)}
  100%{box-shadow:inset 0 -10px 0 var(--kopi-tint),0 4px 0 var(--kopi-shade),var(--shadow-sm)}
}
@media (prefers-reduced-motion:reduce){
  .kaki-tile.is-glow{border-width:5px}
}
@keyframes kaki-deal{
  from{opacity:0;transform:translateY(10px) scale(0.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
/* A pair pops before it goes home: a small swell in the first third, then the
   fade out. The whole thing runs inside the 240ms game.js waits before clearing. */
@keyframes kaki-clear{
  0%{opacity:1;transform:translateY(-4px) scale(1)}
  30%{opacity:1;transform:translateY(-7px) scale(1.06)}
  100%{opacity:0;transform:translateY(-4px) scale(0.62)}
}
@keyframes kaki-wiggle{
  0%{transform:translateY(-4px) rotate(0deg)}
  25%{transform:translateY(-4px) translateX(-4px) rotate(-3deg)}
  60%{transform:translateY(-4px) translateX(4px) rotate(3deg)}
  100%{transform:translateY(-4px) translateX(0) rotate(0deg)}
}

/* ── Player bar ── */
.kaki-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:0.75rem;
  padding:0.5rem 0.75rem;
  border-radius:var(--radius-md);
  background:var(--bg-inset);
  font-size:1.15rem;
  line-height:1.2;
}
/* The name wins the space fight. It is the whole promise of the game, so it takes
   what it needs and the decoration around it gives way. Tapping it reopens the
   chooser, which is why it is a button and clears the tap floor. */
.kaki-player-name{
  flex:1 1 auto;
  min-width:9ch;
  min-height:var(--tap-min);
  padding:0 0.5rem 0 0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  border:none;
  background:none;
  text-align:left;
  font-family:var(--font-body);
  font-size:inherit;
  font-weight:600;
  color:var(--kopi-accent);
  text-decoration:underline;
  text-decoration-style:dotted;
  text-underline-offset:4px;
  cursor:pointer;
}
.kaki-player-name:focus-visible{outline:3px solid var(--kopi-accent);outline-offset:2px}
.kaki-progress{flex:none;color:var(--text-secondary)}

/* One dot per pair, filled as they come home. Decoration only: the row is aria
   hidden and the sentence beside it carries the same news, which is why it is the
   row and not the player's name that stands down when width runs out. */
.kaki-dots{
  display:flex;
  flex:none;
  flex-wrap:nowrap;
  align-items:center;
  gap:0.25rem;
}
.kaki-dot{
  flex:none;
  width:0.5rem;
  height:0.5rem;
  border-radius:50%;
  background:transparent;
  box-shadow:inset 0 0 0 2px var(--text-muted);
}
.kaki-dot.is-found{
  background:var(--kopi-accent);
  box-shadow:none;
  animation:kaki-dot-in var(--duration-fast) var(--ease-gentle) 1;
}
@keyframes kaki-dot-in{
  from{transform:scale(0.4)}
  to{transform:scale(1)}
}

/* ── The two biggest walls ── */

/* Fourteen and sixteen tiles are the only deals that need every pixel. game.js
   flags them and the table closes up a little: smaller ceiling on a tile, tighter
   gutters, tighter boxes. Every other deal keeps the roomier shape. */
.kaki-table[data-wall="big"]{
  --kaki-tile-max:70px;
  --kaki-bubble-height:10rem;
  gap:0.5rem;
}
.kaki-table[data-wall="big"] .kaki-grid{padding:0.25rem}
.kaki-table[data-wall="big"] .kaki-bubble-slot{padding-top:0.5rem}
.kaki-table[data-wall="big"] .kaki-bubble{padding:0.625rem 1rem}

/* Below 24rem the bar cannot hold the name, a dot row and the sentence at once.
   The dots are aria-hidden decoration repeating "N of M pairs" word for word, and
   the name is the whole promise of the game, so the name is what stays whole. */
@media (max-width:24rem){
  .kaki-dots{display:none}
}

/* ── Short phones ── */

/* An iPhone SE is 667px tall, and this play screen already spends its header and
   its player bar before the table gets a say. game.js caps the wall at three rows
   here (see kakiMaxPairs) and everything vertical gives what it can: the
   portraits give the most, since they are decoration and the tiles are not, and
   the bubble drops to two resting lines. It still needs one flick to reach the
   last row. The second row peeks well past the fold so it is obvious there is
   more table down there. */
@media (max-height:43.75rem){
  :root{
    --kaki-portrait-size:3rem;
    --kaki-bubble-height:8rem;
    --kaki-tile-gap:0.375rem;
  }
  .kaki-table{gap:0.5rem}
  .kaki-who{font-size:1rem}
  .kaki-bubble{padding:0.625rem 1rem}
  .kaki-bubble-slot{padding-top:0.5rem}
  /* Three lines of a long line at a long name still has to be readable, so the
     clamp tightens rather than the type shrinking. */
  .kaki-bubble-text{-webkit-line-clamp:3;line-clamp:3}
  .kaki-table[data-wall="big"]{
    --kaki-tile-max:66px;
    --kaki-tile-gap:0.25rem;
    --kaki-portrait-size:2.75rem;
    gap:0.375rem;
  }
}

/* ── Notification stack ── */
#notification-stack{
  position:absolute;
  top:calc(var(--topbar-height) + 8px);
  left:1rem;
  right:1rem;
  z-index:50;
  display:flex;
  flex-direction:column;
  gap:0.5rem;
  pointer-events:none;
}
.notif{
  background:var(--bg-surface);
  border:1.5px solid var(--border-mid);
  border-left:4px solid var(--foliage-mid);
  border-radius:var(--radius-md);
  padding:0.875rem 1rem;
  box-shadow:var(--shadow-md);
  display:flex;
  align-items:flex-start;
  gap:0.75rem;
  pointer-events:auto;
  transform:translateY(-8px);
  opacity:0;
  transition:all var(--duration-normal) var(--ease-gentle);
}
.notif.show{transform:translateY(0);opacity:1}
.notif.hide{transform:translateY(-8px);opacity:0;pointer-events:none}
.notif-icon{color:var(--foliage-mid);flex-shrink:0;margin-top:2px}
.notif-text{flex:1}
.notif-title{
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  color:var(--text-primary);
  margin-bottom:0.1rem;
}
.notif-body{
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-secondary);
  line-height:1.4;
}
.notif-warn{border-left-color:var(--accent-orange)}
.notif-warn .notif-icon{color:var(--accent-orange)}
.notif-success{border-left-color:var(--success)}
.notif-success .notif-icon{color:var(--success)}
.notif-info{border-left-color:var(--foliage-mid)}
.notif-info .notif-icon{color:var(--foliage-mid)}
.notif-streak{border-left-color:var(--streak)}
.notif-streak .notif-icon{color:var(--streak)}
.notif-rare{border-left-color:var(--accent-plum)}
.notif-rare .notif-icon{color:var(--accent-plum)}

/* ── Bottom nav ── */
/* Inset from both edges. The tabs used to sit flush at 0px, and a control
   hard against the side of the screen is the easiest one to hit by accident
   with the hand that is holding the phone. */
.bottom-nav{
  height:var(--nav-height);
  background:var(--bg-surface);
  border-top:1.5px solid var(--border-light);
  display:flex;
  align-items:stretch;
  flex-shrink:0;
  padding:0 0.5rem;
  z-index:20;
}
.nav-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0.2rem;
  background:transparent;
  border:none;
  cursor:pointer;
  color:var(--text-muted);
  transition:all var(--duration-fast) var(--ease-gentle);
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  letter-spacing:0.02em;
  padding:0.5rem;
}
.nav-item[hidden]{display:none}
.nav-item:active{transform:scale(0.95)}
.nav-item.active{color:var(--foliage-shadow)}
.nav-item.active .icon{color:var(--foliage-mid)}
.nav-item:focus-visible{outline:2px solid var(--foliage-mid);outline-offset:-2px}

/* ── Share modal ── */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(43,33,24,0.45);
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0;
}
.modal-overlay[hidden]{display:none}
.modal-sheet{
  background:var(--bg-surface);
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  border:1.5px solid var(--border-mid);
  border-bottom:none;
  width:100%;
  max-width:var(--game-max-width);
  max-height:85dvh;
  overflow-y:auto;
  padding:1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
}
.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:1.25rem;
}
.modal-title{
  font-family:var(--font-display);
  font-size:1.75rem;
  font-weight:500;
  color:var(--text-primary);
}
.modal-actions{display:flex;flex-direction:column;gap:0.75rem;margin-top:1.25rem}

/* ── Harvest confirmation ── */
.harvest-confirm{
  background:var(--bg-inset);
  border:1.5px solid var(--border-mid);
  border-radius:var(--radius-md);
  padding:1rem;
}
.harvest-confirm[hidden]{display:none}
.harvest-confirm-text{
  font-family:var(--font-body);
  font-size:1rem;
  line-height:1.5;
  color:var(--text-secondary);
  margin-bottom:0.875rem;
}
.harvest-confirm-actions{display:flex;gap:0.625rem;flex-wrap:wrap}
.harvest-confirm-actions .btn{flex:1;min-width:140px;padding:0 1rem}

.share-card{
  background:var(--bg-deep);
  border-radius:var(--radius-lg);
  border:1.5px solid var(--border-light);
  overflow:hidden;
}
.share-card-inner{padding:1.5rem}
.share-garden-preview{
  display:flex;
  justify-content:center;
  gap:0.5rem;
  flex-wrap:wrap;
  margin-bottom:1rem;
  min-height:60px;
  align-items:center;
}
.share-preview-plant{width:60px;height:75px}
.share-stats{
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-secondary);
  text-align:center;
  line-height:1.6;
}
.share-stats strong{color:var(--text-primary);font-weight:600}

/* ── Water overlay animation ── */
#water-overlay{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:200;
  display:none;
}
#water-overlay.active{display:block}
.water-drop{
  position:absolute;
  top:-20px;
  width:8px;
  height:16px;
  background:var(--foliage-mid);
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  opacity:0.7;
  animation:water-fall 1s ease-in forwards;
}
@keyframes water-fall{
  0%{transform:translateY(0) scale(1);opacity:0.7}
  100%{transform:translateY(100vh) scale(0.8);opacity:0}
}

/* ── Celebration overlay ── */
#celebration-overlay{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:200;
  display:none;
}
#celebration-overlay.active{display:block}
.confetti-leaf{
  position:absolute;
  top:-30px;
  font-size:0;
  width:12px;
  height:20px;
  border-radius:50%;
  animation:confetti-fall linear forwards;
}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* ── Exercise instruction card ── */
/* Tighter than it was. At 390px the instruction card was pushing the game
   itself below the fold, so the player had to scroll past how-to-play to
   reach the thing it describes. */
.exercise-intro{
  background:var(--bg-surface);
  border:1.5px solid var(--border-light);
  border-radius:var(--radius-lg);
  padding:0.9rem 1.1rem;
  margin-bottom:0.9rem;
}
.exercise-intro-title{
  font-family:var(--font-display);
  font-size:1.35rem;
  font-weight:500;
  margin-bottom:0.4rem;
}
.exercise-intro-body{
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-secondary);
  line-height:1.55;
}

/* ── Round tracker ── */
.round-tracker{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.5rem;
  margin-bottom:0.75rem;
}
.round-dot{
  width:10px;height:10px;
  border-radius:50%;
  background:var(--bg-inset);
  border:1.5px solid var(--border-mid);
  transition:all var(--duration-fast) var(--ease-gentle);
}
.round-dot.done{background:var(--foliage-mid);border-color:var(--foliage-mid)}
.round-dot.current{background:var(--foliage-shadow);border-color:var(--foliage-shadow)}

/* ── Completion card ── */
.completion-card{
  background:var(--bg-surface);
  border:2px solid var(--foliage-mid);
  border-radius:var(--radius-xl);
  padding:2rem 1.5rem;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1rem;
}
.completion-icon{
  width:96px;height:96px;
  border-radius:50%;
  background:rgba(115,135,93,0.15);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--foliage-shadow);
}
.completion-title{
  font-family:var(--font-display);
  font-size:2rem;
  font-weight:500;
  color:var(--text-primary);
}
.completion-sub{
  font-family:var(--font-body);
  font-size:1.1rem;
  color:var(--text-secondary);
  line-height:1.5;
}
.completion-rewards{
  display:flex;
  flex-wrap:wrap;
  gap:0.5rem;
  justify-content:center;
}
.reward-chip{
  display:inline-flex;
  align-items:center;
  gap:0.3rem;
  padding:0.4rem 0.875rem;
  border-radius:var(--radius-pill);
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  border:1.5px solid transparent;
}
.reward-chip.coins{background:rgba(224,122,95,0.15);color:#7A2F10;border-color:var(--accent-coral)}
.reward-chip.seed{background:rgba(115,135,93,0.12);color:var(--foliage-shadow);border-color:var(--foliage-mid)}
.reward-chip.rare{background:rgba(123,83,113,0.12);color:var(--accent-plum);border-color:var(--accent-plum)}

/* ── Result feedback row ── */
.result-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.75rem;
  padding:0.75rem;
  border-radius:var(--radius-md);
  font-family:var(--font-body);
  font-size:1.05rem;
  font-weight:500;
  text-align:center;
}
.result-row.correct{background:rgba(68,87,61,0.10);color:var(--success);border:1.5px solid var(--success)}
.result-row.wrong{background:rgba(174,56,43,0.07);color:var(--accent-red);border:1.5px solid var(--accent-red)}

/* ── Streak bar in profile ── */
.streak-track{
  background:var(--bg-inset);
  border-radius:var(--radius-pill);
  height:14px;
  border:1.5px solid var(--border-light);
  overflow:hidden;
  margin:0.5rem 0;
}
.streak-fill{
  height:100%;
  background:linear-gradient(90deg,var(--foliage-mid),var(--foliage-shadow));
  border-radius:var(--radius-pill);
  transition:width var(--duration-normal) var(--ease-gentle);
}

/* ════════════════════════════════════════════════════════════
   LEVEL PATH — Duolingo-style spiral progression
   ════════════════════════════════════════════════════════════ */

/* Island section */
.island-header{
  display:flex;
  align-items:center;
  gap:1rem;
  padding:1.25rem 1.5rem;
  border-radius:var(--radius-xl);
  margin-bottom:2rem;
  position:relative;
  overflow:hidden;
}
.island-header::before{
  content:'';
  position:absolute;
  inset:0;
  opacity:0.15;
  border-radius:var(--radius-xl);
}
.island-header.memory-meadow{background:var(--bg-deep);border:1.5px solid var(--foliage-mid)}
.island-header.memory-meadow::before{background:var(--foliage-mid)}
.island-header.pattern-peaks{background:rgba(231,143,55,0.08);border:1.5px solid var(--accent-orange)}
.island-header.pattern-peaks::before{background:var(--accent-orange)}
.island-header.logic-lake{background:rgba(123,83,113,0.08);border:1.5px solid var(--accent-plum)}
.island-header.logic-lake::before{background:var(--accent-plum)}
.island-header.word-woods{background:rgba(174,56,43,0.08);border:1.5px solid var(--accent-red)}
.island-header.word-woods::before{background:var(--accent-red)}
.island-header.kopitiam-corner{background:rgba(224,122,95,0.10);border:1.5px solid var(--accent-coral)}
.island-header.kopitiam-corner::before{background:var(--accent-coral)}

.island-icon{
  width:72px;height:72px;
  border-radius:var(--radius-lg);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  background:var(--bg-surface);
  box-shadow:var(--shadow-md);
}
.island-icon svg{width:40px;height:40px}
.island-header.memory-meadow .island-icon{color:var(--foliage-shadow)}
.island-header.pattern-peaks .island-icon{color:#7A4800}
.island-header.logic-lake .island-icon{color:var(--accent-plum)}
.island-header.word-woods .island-icon{color:var(--accent-red)}
.island-header.kopitiam-corner .island-icon{color:var(--kopi-accent)}

.island-title{
  font-family:var(--font-display);
  font-size:1.75rem;
  font-weight:500;
  line-height:1.1;
  margin-bottom:0.2rem;
}
.island-desc{
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-secondary);
  line-height:1.4;
}
.island-progress{
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  color:var(--text-muted);
  margin-top:0.3rem;
  letter-spacing:0.04em;
}

/* Path container */
.path-track{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  padding:1rem 0 2rem;
  position:relative;
}

/* Level node — 3D pill */
.level-node{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  transition:transform var(--duration-fast) var(--ease-gentle);
  margin-bottom:1.75rem;
  /* Path zigzag: JS assigns left/right offset */
  width:100px;
}
.level-node:active{transform:scale(0.92)}
.level-node:focus-visible{outline:3px solid var(--foliage-mid);outline-offset:4px;border-radius:var(--radius-lg)}

/* 3D pill body */
.node-pill{
  width:88px;height:88px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  /* 3D effect: layered shadows */
  box-shadow:
    0 6px 0 var(--node-shadow, #44573D),
    0 10px 20px rgba(43,33,24,0.18),
    inset 0 2px 0 rgba(255,255,255,0.25);
  background:var(--node-bg, var(--foliage-mid));
  border:3px solid var(--node-border, var(--foliage-shadow));
  transition:all var(--duration-fast) var(--ease-gentle);
}
.level-node:active .node-pill{
  box-shadow:
    0 2px 0 var(--node-shadow, #44573D),
    0 4px 8px rgba(43,33,24,0.15),
    inset 0 2px 0 rgba(255,255,255,0.2);
  transform:translateY(4px);
}

/* Node inner icon */
.node-pill svg{
  width:40px;height:40px;
  color:var(--node-icon-color, #F5EFEB);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,0.2));
}

/* Node level number badge */
.node-badge{
  position:absolute;
  top:-8px;right:-8px;
  width:28px;height:28px;
  border-radius:50%;
  background:var(--bg-surface);
  border:2.5px solid var(--node-border, var(--foliage-mid));
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:600;
  color:var(--text-primary);
  box-shadow:var(--shadow-sm);
  z-index:2;
}

/* Node label below pill */
.node-label{
  margin-top:0.6rem;
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  color:var(--text-secondary);
  text-align:center;
  line-height:1.2;
  max-width:90px;
}

/* ── Level states ── */

/* Completed */
.level-node.completed .node-pill{
  --node-bg:var(--foliage-shadow);
  --node-border:var(--foliage-deep);
  --node-shadow:var(--foliage-deep);
  --node-icon-color:#B1B8A1;
}
.level-node.completed .node-badge{
  background:var(--foliage-mid);
  border-color:var(--foliage-shadow);
  color:#F5EFEB;
}

/* Current (next to play) */
.level-node.current .node-pill{
  --node-bg:var(--foliage-mid);
  --node-border:var(--foliage-shadow);
  --node-shadow:#44573D;
  --node-icon-color:#F5EFEB;
  animation:node-pulse 2.5s ease-in-out infinite;
}
@keyframes node-pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}
.level-node.current .node-badge{
  background:var(--foliage-mid);
  border-color:var(--foliage-shadow);
  color:#F5EFEB;
}

/* Locked */
.level-node.locked{
  cursor:default;
  pointer-events:none;
}
.level-node.locked .node-pill{
  --node-bg:var(--bg-inset);
  --node-border:var(--border-mid);
  --node-shadow:var(--border-mid);
  --node-icon-color:var(--border-mid);
  box-shadow:
    0 6px 0 var(--border-mid),
    0 8px 16px rgba(43,33,24,0.08),
    inset 0 2px 0 rgba(255,255,255,0.1);
}
.level-node.locked .node-badge{
  background:var(--bg-inset);
  border-color:var(--border-mid);
  color:var(--border-mid);
}
.level-node.locked .node-label{
  color:var(--border-mid);
}

/* ── Path connector line ── */

/* Island completion banner */

/* Level reward preview inside node label */
.node-reward{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.2rem;
  margin-top:0.25rem;
  font-size:1rem;
  color:var(--text-muted);
}
.node-reward .icon{width:0.9em;height:0.9em}

/* Path start indicator */

/* Exercise type tag on node */
.node-type-tag{
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  padding:0.2rem 0.6rem;
  border-radius:var(--radius-pill);
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:600;
  letter-spacing:0.06em;
  text-transform:uppercase;
  white-space:nowrap;
  z-index:2;
}
.node-type-tag.tiles{background:var(--foliage-mid);color:#F5EFEB}
.node-type-tag.pattern{background:var(--accent-orange);color:#7A4800}
.node-type-tag.oddone{background:var(--accent-plum);color:#F5EFEB}
.node-type-tag.words{background:var(--accent-red);color:#F5EFEB}
.node-type-tag.kakis{background:var(--accent-coral);color:#3A1F00}

/* Reduced motion — stop pulse */
@media (prefers-reduced-motion: reduce){
  .level-node.current .node-pill{animation:none}
}

/* ════════════════════════════════════════════════════════════
   COURSE SELECT SCREEN
   ════════════════════════════════════════════════════════════ */

.course-list{
  display:flex;
  flex-direction:column;
  gap:1rem;
}

.course-card{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  column-gap:1rem;
  row-gap:0.5rem;
  padding:1.25rem 1.25rem;
  background:var(--bg-surface);
  border:2px solid var(--border-light);
  border-radius:var(--radius-xl);
  cursor:pointer;
  transition:all var(--duration-normal) var(--ease-gentle);
  text-align:left;
  width:100%;
  box-shadow:var(--shadow-paper);
  position:relative;
  overflow:hidden;
}
.course-card::before{
  content:'';
  position:absolute;
  inset:0;
  opacity:0.06;
}
.course-card.memory-meadow::before{background:var(--foliage-mid)}
.course-card.pattern-peaks::before{background:var(--accent-orange)}
.course-card.logic-lake::before{background:var(--accent-plum)}
.course-card.word-woods::before{background:var(--accent-red)}
.course-card.kopitiam-corner::before{background:var(--accent-coral)}

.course-card:not(.course-locked):hover{
  border-color:var(--foliage-mid);
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}
.course-card:not(.course-locked):active{transform:scale(0.98)}
.course-card:focus-visible{outline:3px solid var(--foliage-mid);outline-offset:2px}

.course-card.course-locked{
  opacity:0.55;
  cursor:default;
  pointer-events:none;
}
.course-card.course-complete{
  border-color:var(--foliage-mid);
}

.course-card-icon{
  grid-column:1;
  width:56px;height:56px;
  border-radius:var(--radius-lg);
  background:var(--bg-deep);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.course-card-icon svg{width:38px;height:38px}
.course-card.memory-meadow .course-card-icon{color:var(--foliage-shadow)}
.course-card.pattern-peaks .course-card-icon{color:#7A4800}
.course-card.logic-lake .course-card-icon{color:var(--accent-plum)}
.course-card.word-woods .course-card-icon{color:var(--accent-red)}
.course-card.kopitiam-corner .course-card-icon{color:var(--kopi-accent)}

/* 1.35rem rather than 1.5rem: at 390px the longest course name, "Memory
   Meadow", broke onto a second line at the larger size once the icon and
   arrow had taken their columns. */
.course-card-name{
  grid-column:2;
  font-family:var(--font-display);
  font-size:1.35rem;
  font-weight:500;
  line-height:1.15;
}
.course-card-desc{
  grid-column:1 / -1;
  font-family:var(--font-body);
  font-size:1.05rem;
  color:var(--text-secondary);
  line-height:1.45;
}
.course-card-progress{grid-column:1 / -1}
.course-card-progress{
  display:flex;
  align-items:center;
  gap:0.5rem;
}
.course-badge{
  display:inline-flex;
  align-items:center;
  gap:0.3rem;
  padding:0.25rem 0.75rem;
  border-radius:var(--radius-pill);
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  border:1.5px solid transparent;
}
.course-badge.done{background:rgba(68,87,61,0.12);color:var(--success);border-color:var(--success)}
.course-badge.progress{background:var(--bg-inset);color:var(--text-secondary);border-color:var(--border-mid)}
.course-badge.locked{background:var(--bg-inset);color:var(--text-muted);border-color:var(--border-mid)}

.course-arrow{
  color:var(--foliage-mid);
  flex-shrink:0;
  width:1.5em;height:1.5em;
}
.course-lock{
  color:var(--border-mid);
  flex-shrink:0;
}

/* ── PATH BACK BAR ── */
.path-back-bar{
  margin-bottom:1.25rem;
}

/* ── PATH SVG CONNECTORS ── */
.path-wrap{
  position:relative;
}
.path-svg{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:0;
  overflow:visible;
}
.path-track{
  position:relative;
  z-index:1;
}

/* ── NODE BODY (tag + label + reward in flow) ── */
.node-body{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0.2rem;
  margin-top:0.5rem;
}

/* ════════════════════════════════════════════════════════════
   TILE FLIP
   The .tile rule itself lives with the rest of the tile game further up.
   Splitting it across two places is what hid the overflow:hidden that broke
   this flip in the first place.
   ════════════════════════════════════════════════════════════ */
.tile-face{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  backface-visibility:hidden;
  border-radius:var(--radius-md);
}
.tile-back{
  background:var(--bg-inset);
  border:2px solid var(--border-mid);
}
.tile-back svg{
  width:50%;height:50%;
  color:var(--border-mid);
}
.tile-front{
  background:var(--bg-surface);
  border:2px solid var(--foliage-mid);
  transform:rotateY(180deg);
}
.tile-front svg{
  width:70%;height:70%;
  color:var(--foliage-shadow);
}
.tile.matched .tile-front{
  border-color:var(--foliage-mid);
  background:rgba(115,135,93,0.10);
}
.tile.matched .tile-front svg{
  color:var(--foliage-mid);
}

/* ════════════════════════════════════════════════════════════
   SCREEN TRANSITIONS
   ════════════════════════════════════════════════════════════ */
.screen{
  transition:opacity 220ms var(--ease-gentle),transform 220ms var(--ease-gentle);
}
.screen.exit-forward{
  opacity:0;
  transform:translateX(-16px);
  pointer-events:none;
}
.screen.exit-back{
  opacity:0;
  transform:translateX(16px);
  pointer-events:none;
}
.screen.enter-forward{
  opacity:0;
  transform:translateX(16px);
}
.screen.enter-back{
  opacity:0;
  transform:translateX(-16px);
}
.screen.enter-forward.active,
.screen.enter-back.active{
  opacity:1;
  transform:translateX(0);
}

/* ════════════════════════════════════════════════════════════
   COIN FLY ANIMATION
   ════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════
   STAGGER ENTRY
   ════════════════════════════════════════════════════════════ */
.stagger-item{
  opacity:0;
  transform:translateY(10px);
  animation:stagger-in 300ms var(--ease-gentle) forwards;
}
@keyframes stagger-in{
  to{opacity:1;transform:translateY(0)}
}

/* ════════════════════════════════════════════════════════════
   THIRSTY PLANT SWAY (keyframe shared with shelf plots)
   ════════════════════════════════════════════════════════════ */
@keyframes thirsty-sway{
  0%,100%{transform:translateX(-50%) rotate(-1.5deg)}
  50%{transform:translateX(-50%) rotate(1.5deg)}
}

/* ════════════════════════════════════════════════════════════
   GARDEN HINT CARD (first visit)
   ════════════════════════════════════════════════════════════ */
/* Stacked and compact: it sits above the pan window, where every pixel it
   takes is a pixel of field the player loses. */
.garden-hint-card{
  display:flex;
  flex-direction:column;
  gap:0.5rem;
  padding:0.9rem 1rem;
  background:var(--bg-surface);
  border:1.5px solid var(--foliage-mid);
  border-radius:var(--radius-lg);
  margin-bottom:0.6rem;
}
.garden-hint-head{display:flex;align-items:center;gap:0.6rem}
.garden-hint-card .icon{color:var(--foliage-mid);flex-shrink:0}
.garden-hint-title{
  font-family:var(--font-display);
  font-size:1.3rem;
  font-weight:500;
}
.garden-hint-body{
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-secondary);
  line-height:1.4;
}
.garden-hint-card .btn{width:100%}

/* ════════════════════════════════════════════════════════════
   MISC FIXES
   ════════════════════════════════════════════════════════════ */

/* Shop lock note */
.shop-lock-note{
  grid-column:1 / -1;
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--accent-plum);
}
.shop-free-label{
  font-family:var(--font-body);
  font-size:1.1rem;
  font-weight:500;
  color:var(--foliage-shadow);
  white-space:nowrap;
}
.rare-tag{
  color:var(--accent-plum);
  font-size:1rem;
  font-family:var(--font-body);
  font-weight:500;
  letter-spacing:0.06em;
  white-space:nowrap;
}

/* Pattern turn message */
.pattern-turn-msg{
  font-family:var(--font-body);
  font-size:1.1rem;
  color:var(--text-muted);
  font-style:italic;
}

/* Reduced motion — degrade to crossfade not zero */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0ms !important;
  }
  .screen.exit-forward,.screen.exit-back,
  .screen.enter-forward,.screen.enter-back{
    transition:opacity 100ms ease !important;
    transform:none !important;
  }
  .shelf-plot.thirsty .plot-plant{animation:none}
  .shelf-tag.affordable{animation:none}
}

/* ── Safe area ── */
@supports(padding:max(0px)){
  .topbar{padding-top:max(0.5rem, env(safe-area-inset-top))}
  .bottom-nav{padding-bottom:max(0.5rem, env(safe-area-inset-bottom))}
}

<div id="app">

  <!-- Top bar -->

    <div class="topbar-left">
      <span class="coin-chip" id="coin-display" aria-label="Coins">
        <svg class="icon icon-sm"><use href="#icon-coin"/></svg>
        <span id="coin-count">0</span>
      </span>
      <span class="streak-chip" aria-label="Streak">
        <svg class="icon icon-sm"><use href="#icon-streak"/></svg>
        <span id="streak-count">0</span>
      </span>
    </div>
    <div class="topbar-right">
      <!-- Labelled on purpose. A bare hamburger is exactly the abstract
           convention that guidance for older users warns against assuming. -->
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-haspopup="dialog" aria-expanded="false">
        <svg class="icon"><use href="#icon-menu"/></svg>
        <span class="menu-btn-label">Menu</span>
        <span class="menu-badge" id="menu-badge" hidden></span>
      </button>
    </div>
  </header>

  <!-- Notification stack -->
  <div id="notification-stack" aria-live="polite" aria-atomic="false"></div>

  <!-- ══ SCREENS ══ -->
  <main class="screens" role="main">

    <!-- ── PATCHES SCREEN — the garden itself ── -->
    <section class="screen active" id="screen-garden2" role="tabpanel" aria-labelledby="nav-garden2">
      <div class="screen-header">
        <h1 class="screen-title">Your Patches</h1>
        <p class="screen-subtitle" id="garden-date"></p>
      </div>
      <!-- Today's tasks, in one line. The full list still lives in the menu;
           this is here so a player who never opens the menu still knows there
           is something waiting today. -->
      <button class="today-strip" id="today-strip" hidden>
        <svg class="icon" aria-hidden="true"><use href="#icon-sun"/></svg>
        <span class="today-strip-text" id="today-strip-text"></span>
        <svg class="icon icon-sm today-strip-arrow" aria-hidden="true"><use href="#icon-arrow-right"/></svg>
      </button>

           field, so it cannot be dragged out of sight. -->
      <div class="garden-hint-slot" id="garden-hint-slot"></div>
      <!-- Bounded pan window: the field is larger than the phone, so it is
           dragged under this fixed window instead of the page scrolling. The
           header and the water button never move. -->
      <div class="garden2-viewport" id="garden2-viewport">
        <div class="garden2-field" id="garden2-scene"></div>
      </div>
      <div class="garden-actions">
        <!-- Every patch has to be reachable without a drag. This shrinks the
             field to fit the window so the whole garden is tappable. -->
        <button class="btn btn-secondary btn-view" id="btn-fit-view">
          <svg class="icon" aria-hidden="true"><use href="#icon-garden"/></svg>
          <span id="btn-fit-view-label">See whole garden</span>
        </button>
        <button class="btn btn-primary btn-lg" id="btn-water-all">
          <svg class="icon"><use href="#icon-water"/></svg>
          Water all plants
        </button>

        <h1 class="screen-title">Brain Exercises</h1>

      </div>
      <div id="level-path-container"></div>

'use strict';

/* ── STATE MANAGEMENT ───────────────────────────────────────── */

const STORAGE_KEY = 'garden-of-life-v1';
const SCHEMA_VERSION = 5;

/* Visiting ?reset wipes the save and reloads onto a clean garden.
   Wanted for two reasons: it is the only way to see the first-run experience
   again once you have played, and a demo needs a fresh garden between takes
   and between judges. The parameter is stripped on the way out so a reload
   or a bookmark does not silently wipe the save a second time. */
if (typeof location !== 'undefined' && /[?&]reset\b/.test(location.search)) {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* nothing to clear */ }
  location.replace(location.pathname);
}

const DEFAULT_STATE = {
  schemaVersion: SCHEMA_VERSION,
  coins: 20,
  streak: 1,
  streakLastDate: null,
  freeSeedDate: null,
  sound: true,
  plants: [],
  ownedSeeds: ['pandan'],
  unlockedMeals: [],
  exerciseHistory: [],
  totalExercises: 0,
  lastVisit: null,
  levelProgress: {},
  streakFreezes: 1,
  recentlyServed: { odd: [], words: [], tiles: [] },
  activeIsland: null,
  shelves: 1,
  stats: {
    plantsWatered: 0, plantsBloomed: 0, plantsRevived: 0, plantsHarvested: 0,
    exercisesCompleted: 0, perfectExercises: 0, levelsReplayed: 0,
    distinctDaysPlayed: 0, monthsPlayed: [], photosShared: 0,
    speciesEverGrown: [], kakiRounds: 0,
  },
  achievements: {},
  achievementQueue: [],
  daily: {
    date: null, tasks: [],
    weekStart: null, weekCompleted: 0, weekClaimed: false,
  },
  absence: { lastStreakBeforeGap: 0, restorePending: false, comebackToday: false, forgivenCount: 0 },
  /* Ids of garden visitors the player has welcomed. loadState() spreads
     DEFAULT_STATE under the save, so a v5 file from before visitors existed
     picks this up as an empty list without needing a schema bump. */
  visitorsSeen: [],
  /* Kopitiam Corner keeps its own little profile: the kakis remember a name and
     a shared history the garden has no use for. Left null until the player first
     sits down, and normalised through adoptKakis() rather than spread from a
     literal here. loadState() shallow-copies DEFAULT_STATE, so a nested object
     written straight into it would be shared with every later mutation. */
  kakis: null,
};

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.schemaVersion !== SCHEMA_VERSION) {
        return migrateState(parsed);
      }
      return { ...DEFAULT_STATE, ...parsed };
    }
  } catch (e) { /* fresh start */ }
  return { ...DEFAULT_STATE };
}

function migrateState(old) {
  const base = { ...DEFAULT_STATE };
  ['coins','streak','streakLastDate','freeSeedDate','sound','plants','ownedSeeds',
   'unlockedMeals','exerciseHistory','totalExercises','lastVisit','levelProgress',
   'streakFreezes','recentlyServed','activeIsland','shelves'].forEach(k => {
    if (old[k] !== undefined) base[k] = old[k];
  });
  /* v3: unlock enough shelves to hold every existing plant, so no progress is lost.
     The floor is a backstop for saves from before shelves existed. A save that
     already carries a count keeps it, because recomputing from plant count
     revoked shelves people had paid for: two plants on two shelves came back as
     one shelf and three lost pots. Harmless while v3 was the only migration to
     run; the v5 bump sends every existing save down this path, so it matters. */
  const shelfFloor = Math.max(1, Math.ceil((base.plants.length || 1) / 3));
  base.shelves = Number.isFinite(old.shelves) && old.shelves >= shelfFloor
    ? Math.floor(old.shelves)
    : shelfFloor;
  // v4 backfill: credit existing players for what they already did
  base.stats = { ...DEFAULT_STATE.stats, ...(old.stats || {}) };
  if (!old.stats) {
    base.stats.exercisesCompleted = old.totalExercises || 0;
    base.stats.plantsBloomed = (old.plants || []).filter(p => p.state === 'bloom').length;
    base.stats.speciesEverGrown = [...new Set((old.plants || []).map(p => p.seedId))];
    base.stats.plantsWatered = (old.plants || []).filter(p => p.wateredAt).length;
  }
  base.achievements = old.achievements || {};
  base.achievementQueue = [];
  base.daily = { ...DEFAULT_STATE.daily };
  base.absence = { ...DEFAULT_STATE.absence };
  // v5: Kopitiam Corner. Carried through raw. adoptKakis() vets every field the
  // first time the player sits down, so a save from any earlier version arrives
  // with an untouched profile rather than a half-built one.
  base.kakis = old.kakis || null;
  if (base.stats.kakiRounds === undefined) base.stats.kakiRounds = 0;
  base.schemaVersion = SCHEMA_VERSION;
  return base;
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* ── SHUFFLE — Fisher-Yates ─────────────────────────────────── */

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── DATE UTILITIES ─────────────────────────────────────────── */

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function dayOffsetStr(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function daysBetween(a, b) {
  const da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}

function isNewDay(lastDate) {
  if (!lastDate) return true;
  return todayStr() !== lastDate;
}
