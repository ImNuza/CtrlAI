<title>Garden of Life</title>
<style>
/* ============================================================
   GARDEN OF LIFE — Mobile App Styles
   Muted Botanical Design System · Senior-safe UX floor
   ============================================================ */

/* ── Tokens ── */
:root{
  --bg-primary:#EEE9D9;
  --bg-surface:#F5EFEB;
  --bg-deep:#EAE2D0;
  --bg-inset:#E3DBCA;
  --foliage-highlight:#B1B8A1;
  --foliage-mid:#73875D;
  --foliage-shadow:#44573D;
  --foliage-muted:#859B6A;
  --foliage-deep:#31482E;
  --earth:#958579;
  --earth-deep:#7A6B5C;
  --accent-red:#AE382B;
  --accent-orange:#E78F37;
  --accent-plum:#7B5371;
  --accent-crimson:#C82A36;
  --accent-coral:#E07A5F;
  --health-full:#73875D;
  --health-wilt:#B1B8A1;
  --health-thirsty:#E78F37;
  --reward-coin:#E07A5F;
  --reward-rare:#7B5371;
  --streak:#AE382B;
  --success:#44573D;
  --text-primary:#2B2118;
  --text-secondary:#5A4A3C;
  --text-muted:#6B5D52;
  --text-on-dark:#F5EFEB;
  --text-label:#44573D;
  --border-light:#D9D0BC;
  --border-mid:#C6BAA5;
  --border-strong:#958579;
  --font-display:'Fraunces','Cormorant Garamond',Georgia,serif;
  --font-body:'Work Sans','Karla',system-ui,sans-serif;
  --font-label:'Pinyon Script',cursive;
  --radius-sm:0.375rem;
  --radius-md:0.75rem;
  --radius-lg:1.25rem;
  --radius-xl:2rem;
  --radius-pill:9999px;
  --shadow-sm:0 1px 3px rgba(43,33,24,0.10);
  --shadow-md:0 4px 12px rgba(43,33,24,0.12);
  --shadow-lg:0 10px 28px rgba(43,33,24,0.14);
  --shadow-paper:0 2px 8px rgba(149,133,121,0.20);
  --ease-gentle:cubic-bezier(0.4,0,0.2,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --duration-fast:180ms;
  --duration-normal:300ms;
  --duration-slow:500ms;
  --topbar-height:64px;
  --nav-height:80px;
  --game-max-width:430px;
  --tap-min:64px;
}

/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  background:var(--bg-primary);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:1rem;
  line-height:1.55;
  overflow:hidden;
  height:100vh;
  height:100dvh;
}

/* ── SVG icon utility ── */
.icon{width:1.4em;height:1.4em;display:inline-block;vertical-align:middle;flex-shrink:0}
.icon-sm{width:1em;height:1em}
.icon-lg{width:2em;height:2em}
.icon-xl{width:2.5em;height:2.5em}

/* ── App shell ── */
#app{
  max-width:var(--game-max-width);
  margin:0 auto;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  background:var(--bg-primary);
}

/* ── Top bar ── */
.topbar{
  height:var(--topbar-height);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 1rem;
  background:var(--bg-surface);
  border-bottom:1px solid var(--border-light);
  flex-shrink:0;
  z-index:20;
}
.topbar-left{display:flex;align-items:center;gap:0.5rem}
.topbar-right{display:flex;align-items:center;gap:0.5rem}

.coin-chip,.streak-chip{
  display:inline-flex;
  align-items:center;
  gap:0.3rem;
  padding:0.35rem 0.75rem;
  border-radius:var(--radius-pill);
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  border:1.5px solid transparent;
}
.coin-chip{background:rgba(224,122,95,0.15);color:#7A2F10;border-color:var(--accent-coral)}
.coin-chip.large{font-size:1.2rem;padding:0.5rem 1rem}
.streak-chip{background:rgba(174,56,43,0.10);color:var(--accent-red);border-color:var(--accent-red)}

.icon-btn{
  width:var(--tap-min);
  height:var(--tap-min);
  border-radius:var(--radius-md);
  background:transparent;
  border:1.5px solid var(--border-mid);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--text-secondary);
  transition:all var(--duration-fast) var(--ease-gentle);
  flex-shrink:0;
}
/* Wide enough to carry its name under the icon. The icon alone was the only
   unlabelled control left in the app. */
.menu-btn{
  width:auto;
  min-width:var(--tap-min);
  padding:0 0.6rem;
  flex-direction:column;
  gap:0.1rem;
}
.menu-btn-label{
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  line-height:1;
}

/* Menu button and its badge: the one mark that says today has tasks left,
   now that the daily card lives inside the menu rather than in the garden. */
#menu-btn{position:relative}
.menu-badge{
  position:absolute;
  top:9px;
  right:9px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--accent-red);
  border:2px solid var(--bg-surface);
}
.menu-badge[hidden]{display:none}

/* Full width rows inside the menu sheet */
.menu-row{
  width:100%;
  justify-content:flex-start;
  padding:0 1.25rem;
}

.icon-btn:hover{border-color:var(--border-strong);color:var(--text-primary)}
.icon-btn:active{transform:scale(0.96)}
.icon-btn:focus-visible{outline:3px solid var(--foliage-mid);outline-offset:2px}

/* ── Screens ── */
.screens{
  flex:1;
  overflow:hidden;
  position:relative;
}
.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:1.5rem 1.25rem calc(var(--nav-height) + 2rem);
}
.screen.active{display:flex}

/* ── Screen headers ── */
.screen-header{margin-bottom:1.5rem}
.screen-title{
  font-family:var(--font-display);
  font-size:2.5rem;
  font-weight:500;
  line-height:1.1;
  color:var(--text-primary);
  margin-bottom:0.25rem;
}
.screen-subtitle{
  font-family:var(--font-body);
  font-size:1.05rem;
  color:var(--text-secondary);
  line-height:1.5;
}
.subsection-head{
  font-family:var(--font-body);
  font-size:1rem;
  font-weight:500;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--text-muted);
  margin:1.5rem 0 0.75rem;
}

/* ── One plot of soil patches in the grass ── */
/* The space above each patch is headroom for a tall plant to grow into, so
   it stays generous. The strip below is just grass between plots. */
.shelf-unit{
  position:relative;
  padding:0.75rem 0.5rem 1rem;
}
.shelf-pots{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0.5rem;
  padding:0 0.5rem;
  align-items:end;
}

/* The button is the tap target, and the soil tile fills its full width, so the
   hit area is never smaller than what the eye aims at. At the 300px column
   this lands near 84x128, well clear of the 64px floor. */
.shelf-plot{
  position:relative;
  height:128px;
  min-width:var(--tap-min);
  background:transparent;
  border:none;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding:0;
  font-family:inherit;
  transition:transform var(--duration-fast) var(--ease-gentle);
}
.shelf-plot:active{transform:scale(0.94)}
.shelf-plot:focus-visible{outline:3px solid var(--foliage-mid);outline-offset:2px;border-radius:var(--radius-sm)}
.shelf-plot.has-plant:hover .plot-plant{transform:translateX(-50%) scale(1.05)}
.shelf-plot.has-plant .plot-plant{transition:transform 200ms var(--ease-gentle)}

.plot-plant{
  position:absolute;
  /* Above the soil rather than behind it. .plot-pot is painted after this in
     the DOM, so without the stacking order the sprite was hidden by the very
     patch it is meant to be growing in. The sprite carries its own small
     mound, so overlapping the top of the patch is what reads as planted. */
  z-index:2;
  bottom:26px;
  left:50%;
  transform:translateX(-50%);
  width:84px;
  pointer-events:none;
  animation:plant-settle 400ms var(--ease-spring);
}
/* 32x32 pixel sprites with the plant on the bottom edge, so they drop into
   the slot the SVG used without re-anchoring. Scaled by whole numbers only:
   pixelated rendering at a fractional scale gives some pixels one screen
   pixel and their neighbours two, which reads as a wobble along every edge. */
.plant-art{
  display:block;
  width:100%;
  height:auto;
  image-rendering:pixelated;
  /* Grounds the sprite on the soil. Without it the plant reads as floating,
     because the sprite carries no shadow of its own. */
  filter:drop-shadow(0 2px 0 rgba(43,33,24,0.28));
}
/* 2x. 1x would be pixel-perfect against the gardener but leaves a mature
   bush smaller than a seedling patch; 2x reads clearly at arm's length,
   which matters more here. */
.plot-plant .plant-art{width:64px;margin:0 auto -4px}
/* A ripe patch lifts very slightly. The plates already draw open flowers and
   fruit at bloom, so this only has to catch the eye, not explain anything. */
.plant-art.is-ripe{animation:ripe-bob 2.6s ease-in-out infinite}
@keyframes ripe-bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}
@media (prefers-reduced-motion:reduce){
  .plant-art.is-ripe{animation:none}
}
/* Shop rows and the seed menu draw the same sprites, at whole scales again. */
.shop-item-icon .plant-art{width:64px;filter:none}
.plant-detail-svg .plant-art{width:128px;margin:0 auto}
@keyframes plant-settle{
  from{transform:translateX(-50%) translateY(-8px);opacity:0}
  to{transform:translateX(-50%) translateY(0);opacity:1}
}

/* ── Sowing ──
   The seed drops in from above the patch, lands, and the soil takes it with
   a small settle. Longer and more deliberate than plant-settle, because this
   one marks something the player chose to do rather than a redraw. */
.plot-plant.sowing{
  animation:seed-drop 620ms var(--ease-spring);
}
@keyframes seed-drop{
  0%   {transform:translateX(-50%) translateY(-46px) scale(0.55);opacity:0}
  45%  {opacity:1}
  /* Contact with the soil */
  62%  {transform:translateX(-50%) translateY(2px)  scale(1.06)}
  78%  {transform:translateX(-50%) translateY(-3px) scale(0.98)}
  100% {transform:translateX(-50%) translateY(0)    scale(1);opacity:1}
}

/* Ring of loose earth thrown up as the seed lands. Timed to start at the
   moment of contact rather than with the drop. */
.sow-puff{
  position:absolute;
  bottom:16px;
  left:50%;
  width:26px;
  height:10px;
  margin-left:-13px;
  border-radius:50%;
  border:2px solid rgba(122,107,92,0.65);
  opacity:0;
  pointer-events:none;
  animation:sow-puff 520ms var(--ease-gentle) 340ms;
}
@keyframes sow-puff{
  0%  {transform:scale(0.3);opacity:0}
  30% {transform:scale(1);  opacity:0.9}
  100%{transform:scale(2.1);opacity:0}
}

/* Reduced motion gets the result, not the performance. */
@media (prefers-reduced-motion:reduce){
  .plot-plant.sowing{animation:none}
  .sow-puff{display:none}
}

/* ── Soil patch ──
   A flat rectangular tile of tilled ground lying in the grass, not a pot
   standing on a shelf. Filling the button width and dropping most of the
   corner rounding is what turns the row into a field of plots. The furrows
   are a low-contrast repeating gradient so the patch reads as worked soil
   without turning into a busy pattern behind the plant. */
/* The gradient stays underneath the Miora soil plate as the fallback, so a
   patch is never a blank rectangle if the texture has not loaded yet. */
.plot-pot{
  width:100%;
  height:56px;
  image-rendering:pixelated;
  border-radius:8px;
  background:
    url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADwAAAAoCAMAAACVZWnNAAAAwFBMVEU6IBwAAAAuHBYeEAxQOiwmEg5KMCZPQihcSjxjUTt4WU0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSqJG1AAAAQHRSTlP///////////////////////////////////////////////////////////////////////////////////8AwnuxRAAAAiZJREFUeNqdVguS7CAIpFA+2UvN/W+13ajJzE7ezvqsSozEhhYRlMfZVB53TVXZiY7R8y+55mS6ishjTH4Ip4tqREAqvfMtQakuhVO59QCYjx+Ho0lmCl5T7oQfcjikmr13m2DtHUNRp8YksEsvc+4JkbsZhqbelUw8HWgtMLBo7WpiZuPLQOkcYNjm4AkMhRMLY5yCzmqEyfhWyCARKuUE/iJTgEFUS7rRmsoFbntY0vhy0tagQ7bB2ctyv7C3OtRvwaRNXy/wvX3TG4UGlynBuklaTzBpN9luZmvNbcPmBRasOVLfwK6fd7rA/Qb8mXXrBJunVECK7vis5QBLbsdIgelty/xbdF6OUG5+D4Id3j7RL9HUX1ai+hpisfbZbnbjU3BLHYxo/+HuAoN7fFpz1/cAQ7KqfRb7c2Atr5hEWZY7cHxwemuBXMJMgu/tNVcWA9h9nAzXPbAW7XmqdNOyPIN/cdKr75mECeE+u+zts1UGF1a2B1bu10a/bek1jh/h6RWev6WSf7BHDkumIZjeD8+ZDFDTUeU2DzRKnc+DwZGttK1MSpPK2TUW3/HVxpt1eliOqrDGKsg6jwmrws7iqZRPHRDDS14Vo+pzRD+D+gtO8ohhaoj9QMkHJx13i6zLg42bARZAPAperJZS1Z8t8AmS0L8EvDy4rjtJI93IMkcojaLkd5KF1uRyKAXdEmAV9nIbWlec0eEBYl12Ro+HItPzOvUNJ7M6s6U6yvAAAAAASUVORK5CYII=) center/cover no-repeat,
    repeating-linear-gradient(96deg,rgba(43,33,24,0.10) 0 3px,transparent 3px 13px),
    linear-gradient(180deg,#7A6248 0%,#5A4834 100%);
  /* The spread ring is the loose earth where the patch meets the grass. It is
     a shadow rather than a pseudo-element behind the patch, because a
     negative z-index child can fall behind the screen background once the
     screen picks up a transform during a transition. */
  box-shadow:
    0 0 0 3px rgba(122,107,92,0.32),
    inset 0 2px 0 rgba(255,255,255,0.10),
    inset 0 -3px 5px rgba(43,33,24,0.22),
    0 2px 3px rgba(43,33,24,0.16);
  position:relative;
}
/* Bare soil is pale dry earth, which on its own sits only about 1.3:1 against
   the grass. The solid earth border is what carries the boundary: it clears
   3:1 against both the grass and the fill, so the patch stays discernible as
   something you can tap without darkening it into looking planted. */
.plot-pot.empty{
  background:
    url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADwAAAAoCAMAAACVZWnNAAAAwFBMVEW6mosAAAB4WEyAaFpjUDuYh2jVwKSHdm6/pojQroXfvZDozq2delUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABf8r8cAAAAQHRSTlP///////////////////////////////////////////////////////////////////////////////////8AwnuxRAAAAWhJREFUeNqllguShCAMRFMdAjizd+L+t1pY5OeEQVmqLEF4BkmbhMI/Gg0jMEJgzgPmNEq3ANRHCkwAJICIxBGxE2GWNEIcUnye5plj3zlGeVeGExVX0u2GBoMetwrfZ40xZ48L7MpMWWNnrLVHTzcYB5WJyceb1yseoxlgzjOHNNNqYyTYnYtcD3ffMzthnxz4wwNc6PVxIbXOWVd4Zv4tiqcvsFhr1B37K8wKDN1yFGfdW144nPZtYQp6kWSY/U0Y9AHb9zOBX+W5B3/96MkJaqf9yeq+q/DqL9TfLRneCAUNfujoe7BdRrE5fLBd+Yo2d63C7Ye9B/d0DHHebCrMeO+XplmBGTmQ4ZtgxpRR4ajDlUnTSXW0DClRBBM1wxKbiZ9RQw2mucYoIpENdRYYGzBaipUduzW5P6N5qAwCzkwSr1hSyJknS3aJxQk69RZ2LGhSrQGXqw6clUd3d3+9UpB8VEMP2y955HG3ewA7HQAAAABJRU5ErkJggg==) center/cover no-repeat,
    repeating-linear-gradient(96deg,rgba(43,33,24,0.05) 0 3px,transparent 3px 13px),
    linear-gradient(180deg,#CFC4B0 0%,#B8AB95 100%);
  border:2px solid var(--earth-deep);
  box-shadow:inset 0 -2px 4px rgba(43,33,24,0.16);
}

/* Thirsty shows in the ground itself, dry and pale, with a droplet resting on
   the near edge of the patch. Never a fail state, just soil asking for water. */
.shelf-plot.thirsty .plot-plant{animation:thirsty-sway 3s ease-in-out infinite}
.shelf-plot.thirsty .plot-pot{
  background:
    repeating-linear-gradient(96deg,rgba(43,33,24,0.09) 0 3px,transparent 3px 13px),
    linear-gradient(180deg,#9A8465 0%,#7C6A50 100%);
}
.shelf-plot.thirsty::after{
  content:'';
  position:absolute;
  bottom:7px;right:5px;
  width:14px;height:18px;
  background:var(--accent-orange);
  border:2px solid var(--bg-surface);
  border-radius:50% 50% 50% 50% / 65% 65% 38% 38%;
  box-shadow:0 1px 2px rgba(43,33,24,0.30);
  animation:thirsty-drip 1.6s ease-in-out infinite;
}
@keyframes thirsty-drip{
  0%,100%{opacity:0.55;transform:translateY(0)}
  50%{opacity:1;transform:translateY(3px)}
}

/* ── Untilled land, the next plot over ──
   Ground waiting to be cleared rather than a locked object. It sits in the
   grid in reading order like any other plot, so the player pans to it the
   same way they pan to their planted land. */
/* Spans both field columns so it always starts a fresh row below every
   opened patch, regardless of whether the shelf count is odd or even. */
.shelf-locked-unit{padding:0.75rem 0.5rem 1rem;grid-column:1 / -1}
.shelf-locked-plank{
  position:relative;
  width:var(--field-col);
  max-width:100%;
  background:transparent;
  border:none;
  padding:0.5rem 0 0.5rem;
  cursor:pointer;
  font-family:inherit;
}
.shelf-locked-plank:disabled{cursor:default}

.patch-locked-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0.5rem;
  padding:0 0.5rem;
  justify-items:stretch;
}
.patch-locked-slot{
  width:100%;
  height:56px;
  border-radius:8px;
  border:2px dashed rgba(68,87,61,0.55);
  background:rgba(122,107,92,0.14);
}
.shelf-locked-plank:not(:disabled) .patch-locked-slot{
  border-color:var(--foliage-shadow);
  background:rgba(122,107,92,0.22);
}

/* Sits below the dashed slots, not lapped over them. The old negative top
   margin tucked it up into the row, and tag-rise lifted it another 4px, so at
   390px the pill covered the slots it was labelling. */
.shelf-tag{
  position:relative;
  margin:0.65rem auto 0;
  display:inline-flex;
  align-items:center;
  gap:0.5rem;
  flex-wrap:wrap;
  justify-content:center;
  max-width:100%;
  padding:0.55rem 0.95rem;
  background:var(--bg-surface);
  border:1.5px solid var(--border-mid);
  border-radius:var(--radius-lg);
  box-shadow:0 3px 8px rgba(43,33,24,0.22);
  font-family:var(--font-body);
  font-size:1.05rem;
  font-weight:500;
  color:var(--text-secondary);
}
.shelf-tag-text{white-space:nowrap}
.shelf-tag.affordable{
  border-color:var(--foliage-mid);
  color:var(--foliage-shadow);
  animation:tag-rise 2.4s ease-in-out infinite;
}
@keyframes tag-rise{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
.shelf-tag-price{
  display:inline-flex;
  align-items:center;
  gap:0.25rem;
  padding:0.15rem 0.6rem;
  background:rgba(224,122,95,0.15);
  border:1.5px solid var(--accent-coral);
  border-radius:var(--radius-pill);
  color:#7A2F10;
  font-weight:600;
  white-space:nowrap;
}
.shelf-tag-hint{
  margin-top:0.5rem;
  text-align:center;
  font-family:var(--font-body);
  font-size:1rem;
  color:var(--text-secondary);
}

/* ════════════════════════════════════════════════════════════
   PATCHES SCREEN: the garden, on one continuous grass surface
   The field is dragged under a fixed window instead of the page scrolling,
   so the header and the water button never move. Two columns of patches side
   by side, so the field runs past the phone edge and needs a left-right pan.

   The overflow override is scoped to this id on purpose: the shared .screen
   rule still scrolls every other tab. Here the page itself never scrolls.
   The padding is tighter than the shared .screen padding, because every pixel
   taken back is a pixel of field visible without panning.
   ════════════════════════════════════════════════════════════ */
/* The Miora grass plate tiles under the whole tab. The gradient stays beneath
   it so the field still reads as grass if the texture has not loaded, and the
   overlay keeps the texture quiet enough that the patches and the plants stay
   the things the eye lands on. */
#screen-garden2{
  overflow:hidden;
  padding:1rem 1.25rem calc(var(--nav-height) + 0.75rem);
  /* 128px is the 64px tile at exactly 2x, matching the plant sprites. The
     tile is mirrored into itself in the build, so it repeats without a seam.
     No wash over it any more: the pixel tile is already quiet, and a
     translucent layer on top only muddied the palette. */
  background:
    url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAMAAACdt4HsAAAAYFBMVEXL1rS/y6LDy6XW38QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABnQdgcAAABuUlEQVR42q1XSYLEIAikqv//57HFBVpMMkEPiQvIXqrIRYP7balgKGA7wKD4Wek9pUD5kTpCJy5Tpc/vunbQN4XKJBtxnWP9ahsCiCGARt9BNtc7MbBaZyxxRuumjaAbTEdWVKTqy2AJg3G6KnAwvxvwIj6B+636LJ7SD7DZYs9f1GeTTVYz5Ial2qbBLeTUVk1oXXV0I7vYTP1GqVyqAOsQWCl3uVmDRFG9S58a6JucdrmN4cmebhIkSuwFp5vlgSGJLWEUy1UsvcMk1a7E35vqrOQSTuosW0p7qXTV5r2jdemChj7nfe3515LHfkbMDutCn58mAIGkwfjNO5IRGi7oMuZrdUz+Nc3D8v4tGLvDRhpneBYH0IDqLTyEEBI49XG1RRtPoG8OUTxRRDFpr8fIRquKRYCPux1zWr5BknZGdX40W/vQnEc7KJKJJj25KRNTJAQm7v29AsrT+v1cDh+0f21wzITXTjwZxheJdDCVXxZTvpyzgHIG0pKgmoP19MFy4GjLHq7J4z1/wchecfKXrLPXvJcXzWNX3deX7RPX/cSDI//kOfLoyj37kg/P9NM3//jOPf//ANcnBSUZ2QydAAAAAElFTkSuQmCC) 0 0/128px 128px repeat,

/* Header, hint and action dock are fixed furniture; the pan window takes
   whatever is left. Without flex-shrink they get squeezed as the field grows. */
/* Tighter than the other tabs on purpose. Here the field is the content, and
   every pixel the heading gives back is a pixel of garden visible without
   panning. Still 32px, comfortably above the body-text floor. */
#screen-garden2 .screen-header{margin-bottom:0.5rem;flex-shrink:0}
#screen-garden2 .screen-title{font-size:2rem;line-height:1.05;margin-bottom:0.1rem}
/* One step darker than --text-muted: muted clears 4.5:1 on the cream paper
   but not on the deeper end of the grass. */
#screen-garden2 .screen-subtitle{color:var(--text-secondary)}
.garden-hint-slot:not(:empty){flex-shrink:0}

/* One tappable line above the field. Full width and 64px tall so it clears the
   tap floor without competing with the water button for attention. */
.today-strip{
  display:flex;
  align-items:center;
  gap:0.7rem;
  width:100%;
  min-height:64px;
  flex-shrink:0;
  margin-bottom:0.75rem;
  padding:0 1rem;
  background:var(--bg-surface);
  border:1.5px solid var(--border-mid);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-paper);
  font-family:var(--font-body);
  font-size:1.1rem;
  font-weight:500;
  color:var(--text-primary);
  text-align:left;
  cursor:pointer;
}
.today-strip[hidden]{display:none}
.today-strip .icon{color:var(--accent-orange);flex-shrink:0}
.today-strip-text{flex:1}
.today-strip-arrow{color:var(--text-muted)}
.today-strip:active{transform:scale(0.99)}
.today-strip:focus-visible{outline:3px solid var(--foliage-mid);outline-offset:2px}
.today-strip.all-done{border-color:var(--foliage-mid)}
.today-strip.all-done .icon{color:var(--foliage-mid)}

.garden2-viewport{
  position:relative;
  flex:1;
  min-height:0;
  margin:0 -1.25rem;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  cursor:grab;
}
.garden2-viewport.panning{cursor:grabbing}

/* width:max-content makes offsetWidth the true content width, which is what
   the pan bounds are measured from. Two plots of land side by side is what
   makes the field wider than the phone.

   The generous padding and the min sizes are the walkable margin. Without
   them the grid is exactly as big as its rows and the gardener has nowhere
   to stand that is not already a patch. */
.garden2-field{
  --field-col:300px;
  position:relative;
  display:grid;
  grid-template-columns:repeat(2,var(--field-col));
  align-content:start;
  justify-content:start;
  gap:0.75rem 0.75rem;
  width:max-content;
  min-width:100%;
  min-height:560px;
  padding:2.5rem 2.5rem 4rem;
  will-change:transform;
}
.garden2-field.pan-glide{transition:transform 420ms var(--ease-gentle)}

/* ── Simple view ──────────────────────────────────────────────
   One column, full-size patches, ordinary vertical scrolling. No horizontal
   panning exists in this mode, and no patch is ever off the side of the
   screen. The transform is cleared so the scroll container, not the camera,
   is what moves. */
.garden2-viewport.is-simple{
  overflow-y:auto;
  overflow-x:hidden;
  touch-action:pan-y;
  cursor:default;
}
.garden2-field.is-simple{
  grid-template-columns:1fr;
  width:100%;
  min-width:0;
  min-height:0;
  padding:0.25rem 1.25rem 1.5rem;
  transform:none !important;
}
.garden2-field.is-simple .shelf-locked-unit{grid-column:1}
.garden2-field.is-simple .shelf-locked-plank{width:100%}

/* ── Garden visitors ─────────────────────────────────────────
   A tappable creature drifting over the grass. Sized to the tap floor even
   though the drawn shape is smaller, because a butterfly is the hardest
   thing in the game to put a finger on. */
/* The button itself never scales. Only what is inside it moves, so the tap
   area is a flat 64px whether the animation has run, is mid-flight, is
   throttled by a background tab, or is switched off for reduced motion.
   Animating the button was scaling its hit box down to 38px. */
.garden-visitor{
  position:absolute;
  width:64px;
  height:64px;
  z-index:5;
  border:none;
  background:none;
  padding:0;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:visitor-drift 9s ease-in-out infinite;
}
.garden-visitor:focus-visible{outline:3px solid var(--foliage-shadow);outline-offset:3px;border-radius:50%}
.garden-visitor > *{animation:visitor-arrive 700ms var(--ease-spring)}
.garden-visitor.leaving > *{animation:visitor-leave 700ms var(--ease-gentle) forwards}
.visitor-art{width:48px;height:48px;image-rendering:pixelated;display:block}

/* Stand-in until the sprites land. Deliberately simple: a body with two
   wings, enough to read as alive without pretending to be finished art. */
.visitor-fallback{
  position:relative;
  width:26px;
  height:26px;
  border-radius:50%;
  background:var(--foliage-shadow);
  box-shadow:0 2px 3px rgba(43,33,24,0.3);
}
.visitor-fallback::before,
.visitor-fallback::after{
  content:'';
  position:absolute;
  top:2px;
  width:20px;
  height:22px;
  border-radius:60% 60% 40% 40%;
  background:var(--bg-surface);
  border:2px solid var(--foliage-shadow);
}
.visitor-fallback::before{right:16px;transform-origin:right center;animation:visitor-flap 320ms ease-in-out infinite alternate}
.visitor-fallback::after{left:16px;transform-origin:left center;animation:visitor-flap 320ms ease-in-out infinite alternate-reverse}
.visitor-fallback[data-kind="cat"]{width:34px;height:24px;border-radius:40% 40% 45% 45%;background:var(--earth-deep)}
.visitor-fallback[data-kind="cat"]::before,
.visitor-fallback[data-kind="cat"]::after{display:none}

@keyframes visitor-flap{
  from{transform:rotateY(0deg) scaleX(1)}
  to  {transform:rotateY(65deg) scaleX(0.55)}
}
@keyframes visitor-arrive{
  from{opacity:0;transform:translateY(-14px) scale(0.6)}
  to  {opacity:1;transform:translateY(0) scale(1)}
}
@keyframes visitor-leave{
  from{opacity:1;transform:translateY(0) scale(1)}
  to  {opacity:0;transform:translateY(-22px) scale(0.7)}
}
@keyframes visitor-drift{
  0%,100%{translate:0 0}
  25%    {translate:14px -8px}
  50%    {translate:4px 8px}
  75%    {translate:-12px -4px}
}
@media (prefers-reduced-motion:reduce){
  .garden-visitor,
  .garden-visitor > *{animation:none}
  .visitor-fallback::before,.visitor-fallback::after{animation:none}
}

/* ── The gardener ────────────────────────────────────────────
   A view detail, never saved. pointer-events:none so it can never sit
   between a finger and a patch. */
/* One 4x8 sprite sheet: four walk frames across, eight facings down. The row
